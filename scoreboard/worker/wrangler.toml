# Alchemix Arcade global scoreboards — Cloudflare Worker + D1
# Worker renamed to alchemix-games-scores. The D1 database is still referenced by its
# database_id below, so the existing scores stay exactly where they are.
name = "alchemix-games-scores"
main = "src/index.js"
compatibility_date = "2025-09-01"

[vars]
# Browser origins allowed to call the API (comma-separated). Add any new game host here.
ALLOWED_ORIGINS = "https://games.alchemix.uk,http://localhost:5173,http://localhost:8090,http://localhost:8061,http://localhost:8765"

[[d1_databases]]
binding = "DB"
database_name = "lattice-lock-scores"
database_id = "4abb2c40-65e4-4108-87cd-d383ac0f3a30"
migrations_dir = "migrations"

# Optional moderation: `npx wrangler secret put ADMIN_TOKEN` enables
# DELETE /api/scores/<id> with "Authorization: Bearer <token>".

# Online co-op relay: one Durable Object per 4-letter room code (rooms.js).
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "RoomRelay"

[[migrations]]
tag = "v1-rooms"
new_sqlite_classes = ["RoomRelay"]
