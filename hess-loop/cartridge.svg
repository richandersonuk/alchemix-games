<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" width="220" height="220">
  <defs>
    <!-- Deep switchboard-navy shell with cyan/amber/pink edge highlights -->
    <linearGradient id="hl-shell" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1e3a" />
      <stop offset="55%" stop-color="#071022" />
      <stop offset="100%" stop-color="#030711" />
    </linearGradient>
    <linearGradient id="hl-shell-edge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="52%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>
    <linearGradient id="hl-label" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050a16" />
      <stop offset="55%" stop-color="#0a162d" />
      <stop offset="100%" stop-color="#191026" />
    </linearGradient>
    <linearGradient id="hl-gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#a16207" />
    </linearGradient>
    <filter id="hl-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Ambient Drop Shadow -->
  <rect x="28" y="14" width="164" height="174" rx="10" fill="#020408" opacity="0.82" />

  <!-- Bottom PCB Connector Housing -->
  <rect x="44" y="176" width="132" height="28" rx="4" fill="#071121" stroke="#22d3ee" stroke-width="2" />
  <rect x="50" y="180" width="120" height="22" rx="2" fill="#0a1d35" stroke="#fbbf24" stroke-width="1" />

  <!-- Gold Edge Connector Pins -->
  <g fill="url(#hl-gold)">
    <rect x="55" y="182" width="6" height="19" rx="1" />
    <rect x="65" y="182" width="6" height="19" rx="1" />
    <rect x="75" y="182" width="6" height="19" rx="1" />
    <rect x="85" y="182" width="6" height="19" rx="1" />
    <rect x="95" y="182" width="6" height="19" rx="1" />
    <rect x="105" y="182" width="6" height="19" rx="1" />
    <rect x="115" y="182" width="6" height="19" rx="1" />
    <rect x="125" y="182" width="6" height="19" rx="1" />
    <rect x="135" y="182" width="6" height="19" rx="1" />
    <rect x="145" y="182" width="6" height="19" rx="1" />
    <rect x="155" y="182" width="6" height="19" rx="1" />
    <rect x="163" y="182" width="4" height="19" rx="1" />
  </g>

  <!-- Main Cartridge Body with Left Notch -->
  <path d="M 38 14 H 180 A 8 8 0 0 1 188 22 V 174 A 6 6 0 0 1 182 180 H 38 A 6 6 0 0 1 32 174 V 32 L 44 20 V 14 Z"
        fill="url(#hl-shell)" stroke="url(#hl-shell-edge)" stroke-width="2.5" />

  <!-- Top Grip Spine Ribs -->
  <rect x="52" y="18" width="124" height="18" rx="3" fill="#060f1e" stroke="#0891b2" stroke-width="1" />
  <g stroke="#22d3ee" stroke-width="1.8" stroke-linecap="round">
    <line x1="60" y1="22" x2="168" y2="22" />
    <line x1="60" y1="27" x2="168" y2="27" />
    <line x1="60" y1="32" x2="168" y2="32" />
  </g>

  <!-- Side Grip Grooves -->
  <g fill="#050b16" stroke="#0891b2" stroke-width="0.8">
    <rect x="33" y="52" width="7" height="5" rx="1" />
    <rect x="33" y="62" width="7" height="5" rx="1" />
    <rect x="33" y="72" width="7" height="5" rx="1" />
    <rect x="33" y="82" width="7" height="5" rx="1" />
    <rect x="180" y="52" width="7" height="5" rx="1" />
    <rect x="180" y="62" width="7" height="5" rx="1" />
    <rect x="180" y="72" width="7" height="5" rx="1" />
    <rect x="180" y="82" width="7" height="5" rx="1" />
  </g>

  <!-- Security Screws -->
  <g fill="#475569" stroke="#cbd5e1" stroke-width="1">
    <circle cx="43" cy="166" r="4.5" />
    <line x1="40.5" y1="166" x2="45.5" y2="166" stroke="#0f172a" stroke-width="1.4" />
    <circle cx="177" cy="166" r="4.5" />
    <line x1="174.5" y1="166" x2="179.5" y2="166" stroke="#0f172a" stroke-width="1.4" />
  </g>

  <!-- Recessed Center Label Well + Sticker -->
  <rect x="46" y="42" width="128" height="114" rx="6" fill="#030710" stroke="#22d3ee" stroke-width="1.5" />
  <rect x="49" y="45" width="122" height="108" rx="4" fill="url(#hl-label)" stroke="#fbbf24" stroke-width="1.3" />

  <!-- Top Sticker Header Band -->
  <path d="M 50 49 A 3 3 0 0 1 53 46 H 167 A 3 3 0 0 1 170 49 V 61 H 50 Z" fill="#fbbf24" />
  <text x="110" y="56.5" text-anchor="middle" fill="#060c18" font-family="monospace" font-weight="900" font-size="9" letter-spacing="1.4">HESS'S LOOP</text>

  <!-- Corner Badges -->
  <g transform="translate(53, 65)">
    <rect x="0" y="0" width="32" height="14" rx="3" fill="#271c06" stroke="#fbbf24" stroke-width="1" />
    <text x="16" y="9.8" text-anchor="middle" fill="#fde68a" font-family="monospace" font-weight="900" font-size="6.8">ΔH°</text>
  </g>
  <g transform="translate(135, 65)">
    <rect x="0" y="0" width="32" height="14" rx="3" fill="#062333" stroke="#22d3ee" stroke-width="1" />
    <text x="16" y="9.8" text-anchor="middle" fill="#a5f3fc" font-family="monospace" font-weight="900" font-size="6.8">298K</text>
  </g>

  <!-- Subtle Switchboard Circuit Grid Backdrop -->
  <g stroke="#22d3ee" stroke-opacity="0.1" stroke-width="0.7">
    <line x1="56" y1="90" x2="164" y2="90" />
    <line x1="56" y1="112" x2="164" y2="112" />
    <line x1="56" y1="134" x2="164" y2="134" />
    <line x1="74" y1="82" x2="74" y2="138" />
    <line x1="110" y1="82" x2="110" y2="138" />
    <line x1="146" y1="82" x2="146" y2="138" />
  </g>

  <!-- Hess's Law Vector Cycle Triangle -->
  <g filter="url(#hl-glow)">
    <!-- Target direct route (top dashed amber arrow) -->
    <line x1="76" y1="92" x2="138" y2="92" stroke="#fbbf24" stroke-width="2.6" stroke-dasharray="4.5 2.5" stroke-linecap="round" />
    <polygon points="142,92 133,87.5 133,96.5" fill="#fbbf24" />

    <!-- Indirect route left leg (cyan downward arrow) -->
    <line x1="74" y1="96" x2="106" y2="130" stroke="#22d3ee" stroke-width="2.6" stroke-linecap="round" />
    <polygon points="107,131 98,127.5 104,121.5" fill="#22d3ee" />

    <!-- Indirect route right leg (magenta upward arrow) -->
    <line x1="114" y1="130" x2="144" y2="97" stroke="#f472b6" stroke-width="2.6" stroke-linecap="round" />
    <polygon points="145,96 136,99.5 142,105.5" fill="#f472b6" />
  </g>

  <!-- Thermochemical State Nodes -->
  <circle cx="72" cy="92" r="6" fill="#0b1528" stroke="#38bdf8" stroke-width="2" />
  <circle cx="148" cy="92" r="6" fill="#0b1528" stroke="#34d399" stroke-width="2" />
  <circle cx="110" cy="133" r="6" fill="#0b1528" stroke="#f59e0b" stroke-width="2" />

  <!-- Center Conservation Label -->
  <text x="110" y="110" text-anchor="middle" fill="#f8fafc" font-family="monospace" font-weight="900" font-size="8.2" letter-spacing="0.3">ΣΔH=0</text>
  <text x="80" y="121" text-anchor="middle" fill="#67e8f9" font-family="monospace" font-weight="700" font-size="5.6">ΔH₂</text>
  <text x="140" y="121" text-anchor="middle" fill="#f9a8d4" font-family="monospace" font-weight="700" font-size="5.6">ΔH₃</text>

  <!-- Bottom ROM Serial Badge on Sticker -->
  <rect x="55" y="144" width="110" height="7" rx="2" fill="#040b0e" stroke="#fbbf24" stroke-width="0.8" />
  <text x="110" y="149.6" text-anchor="middle" fill="#fde68a" font-family="monospace" font-weight="bold" font-size="5.6" letter-spacing="0.7">ALX-14 • HESS CYCLE</text>

  <!-- Molded Downward Insertion Triangle -->
  <polygon points="103,163 117,163 110,172" fill="#0e7490" stroke="#22d3ee" stroke-width="1" />
</svg>
