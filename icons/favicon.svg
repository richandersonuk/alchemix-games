<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Alchemix Arcade: neon round-bottom alchemy flask -->
  <defs>
    <linearGradient id="ax-liquid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff007f" />
      <stop offset="1" stop-color="#bc13fe" />
    </linearGradient>
    <clipPath id="ax-bulb">
      <circle cx="32" cy="41" r="14.5" />
    </clipPath>
  </defs>
  <rect x="1" y="1" width="62" height="62" rx="14" fill="#050811" />
  <rect x="2.5" y="2.5" width="59" height="59" rx="12.5" fill="none" stroke="#00f3ff" stroke-opacity="0.45" stroke-width="2" />
  <!-- liquid -->
  <rect x="14" y="38" width="36" height="20" fill="url(#ax-liquid)" clip-path="url(#ax-bulb)" />
  <!-- flask outline -->
  <path d="M27 9 H37 M28.5 9 V27.5 A15.5 15.5 0 1 0 35.5 27.5 V9" fill="none" stroke="#00f3ff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" />
  <!-- bubbles -->
  <circle cx="27" cy="45" r="2.4" fill="#ffd6ef" />
  <circle cx="36" cy="49" r="1.7" fill="#ffd6ef" />
  <circle cx="33" cy="33" r="1.4" fill="#00f3ff" />
  <!-- spark -->
  <path d="M49 10 L50.6 15.4 L56 17 L50.6 18.6 L49 24 L47.4 18.6 L42 17 L47.4 15.4 Z" fill="#ffb703" />
</svg>
