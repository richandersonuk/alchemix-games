<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
	<title>Bondlatro: The Octet Engine</title>
	<style>
		html, body {
			margin: 0;
			padding: 0;
			width: 100%;
			height: 100%;
			overflow: hidden;
			background: radial-gradient(circle at 50% 45%, #123c34 0%, #091d1b 55%, #050f12 100%);
			color: #eef6f5;
			font-family: "Noto Sans", "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
			touch-action: none;
		}
		#canvas {
			display: block;
			width: 100%;
			height: 100%;
		}
		#canvas:focus {
			outline: none;
		}
		#status {
			position: fixed;
			inset: 0;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			background: radial-gradient(circle at 50% 42%, #134238 0%, #091b1a 62%, #050d10 100%);
			z-index: 20;
			gap: 16px;
			padding: 24px;
			text-align: center;
		}
		.lab-badge {
			font-size: 12px;
			letter-spacing: 0.16em;
			text-transform: uppercase;
			color: #7ee3cf;
			background: rgba(20, 74, 65, 0.55);
			border: 1px solid rgba(126, 227, 207, 0.35);
			padding: 6px 14px;
			border-radius: 999px;
		}
		.lab-logo {
			width: 116px;
			height: 116px;
			border-radius: 24px;
			box-shadow: 0 10px 30px rgba(0, 0, 0, 0.55), 0 0 28px rgba(77, 227, 193, 0.28);
			border: 2px solid rgba(255, 212, 102, 0.55);
			object-fit: cover;
		}
		.lab-title {
			font-size: clamp(26px, 4vw, 42px);
			font-weight: 800;
			letter-spacing: 0.04em;
			color: #fff6dc;
			text-shadow: 0 3px 16px rgba(0, 0, 0, 0.65);
			margin: 0;
		}
		.lab-sub {
			font-size: 14px;
			color: #a9cbc6;
			margin: 0;
		}
		.ea-bar-wrap {
			width: min(380px, 82vw);
			height: 14px;
			background: rgba(8, 16, 24, 0.85);
			border: 1px solid #355a66;
			border-radius: 999px;
			overflow: hidden;
			box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.6);
		}
		#status-progress {
			width: 12%;
			height: 100%;
			background: linear-gradient(90deg, #1d9bf0 0%, #4de3c1 55%, #ffb703 100%);
			transition: width 0.18s ease-out;
		}
		#status-notice {
			display: none;
			max-width: 540px;
			background: rgba(48, 18, 28, 0.9);
			border: 1px solid #ff6b8b;
			border-radius: 12px;
			padding: 14px 18px;
			color: #ffdce5;
			font-size: 13px;
			line-height: 1.5;
		}
		#device-banner {
			display: none;
			position: fixed;
			top: 8px;
			left: 50%;
			transform: translateX(-50%);
			z-index: 30;
			background: rgba(16, 26, 38, 0.94);
			border: 1px solid #f2b705;
			color: #ffe9a8;
			font-size: 12px;
			padding: 8px 14px;
			border-radius: 10px;
			max-width: 92vw;
			text-align: center;
		}
		#device-banner button {
			margin-left: 10px;
			background: #27445c;
			color: #fff;
			border: 1px solid #5989ad;
			border-radius: 6px;
			padding: 2px 8px;
			cursor: pointer;
		}
		@media (max-width: 680px) {
			#device-banner.active {
				display: block;
			}
		}

	<!-- Alchemix Arcade shared global scoreboard client -->
	<script src="/scoreboard/client.js"></script>
	<script>
		window.BondlatroScores = (function () {
			const GAME_ID = "bondlatro";
			const STORAGE_KEY = "alchemix_bondlatro_scores_v1";
			const MAX_LOCAL = 15;

			function loadLocal() {
				try {
					const raw = localStorage.getItem(STORAGE_KEY);
					if (!raw) return [];
					const arr = JSON.parse(raw);
					return Array.isArray(arr) ? arr : [];
				} catch (_e) {
					return [];
				}
			}

			function saveLocalEntry(entry) {
				const list = loadLocal();
				if (entry && entry.id && list.some(function (e) { return e && e.id === entry.id; })) return list;
				list.push(entry);
				list.sort(function (a, b) { return (Number(b.score) || 0) - (Number(a.score) || 0); });
				if (list.length > MAX_LOCAL) list.length = MAX_LOCAL;
				try {
					localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
				} catch (_e) {}
				return list;
			}

			function fallbackMessage(err) {
				if (window.ArcadeScores && typeof window.ArcadeScores.message === "function") {
					try { return String(window.ArcadeScores.message(err)); } catch (_e) {}
				}
				const map = {
					name: "That name isn't allowed — please pick another.",
					length: "Name must be 3–16 characters.",
					charset: "Use only letters, numbers, spaces, dots, dashes, or underscores (at least 2 letters).",
					invalid: "Score submission was rejected as invalid.",
					duplicate: "This run has already been submitted.",
					rate: "Too many submissions — please wait a moment and try again.",
					offline: "Global scoreboard offline — score saved on this device."
				};
				return map[err] || "Could not submit score right now.";
			}

			const bridge = {
				_fetchState: { done: true, ok: false, offline: false, scores: [] },
				_submitState: { done: true, ok: false, rank: 0, error: "", message: "" },

				hasArcadeClient: function () {
					return Boolean(window.ArcadeScores && typeof window.ArcadeScores.top === "function" && typeof window.ArcadeScores.submit === "function");
				},

				getLocalJSON: function () {
					return JSON.stringify(loadLocal());
				},

				getErrorMessage: function (err) {
					return fallbackMessage(err);
				},

				startFetch: function (board, limit) {
					const state = { done: false, ok: false, offline: false, scores: [] };
					bridge._fetchState = state;
					if (!bridge.hasArcadeClient()) {
						state.done = true;
						state.ok = false;
						state.offline = true;
						state.scores = loadLocal();
						return;
					}
					window.ArcadeScores.top(GAME_ID, { board: board || "main", limit: Number(limit) || 10 })
						.then(function (rows) {
							state.done = true;
							state.ok = true;
							state.offline = false;
							state.scores = Array.isArray(rows) ? rows : [];
						})
						.catch(function () {
							state.done = true;
							state.ok = false;
							state.offline = true;
							state.scores = loadLocal();
						});
				},

				pollFetch: function () {
					return JSON.stringify(bridge._fetchState);
				},

				startSubmit: function (name, score, board, ante, mode, runId) {
					const state = { done: false, ok: false, rank: 0, error: "", message: "" };
					bridge._submitState = state;
					const cleanScore = Math.floor(Number(score) || 0);
					const cleanAnte = Math.max(1, Math.min(99, Math.floor(Number(ante) || 1)));
					const cleanMode = (mode === "CHALLENGE" || mode === "ENDLESS") ? mode : "STANDARD";
					const meta = { ante: cleanAnte, mode: cleanMode };
					const localEntry = {
						id: "local-" + (runId || Date.now()),
						name: String(name),
						score: cleanScore,
						meta: meta,
						date: new Date().toISOString().slice(0, 10)
					};

					if (!bridge.hasArcadeClient()) {
						saveLocalEntry(localEntry);
						state.done = true;
						state.ok = false;
						state.error = "offline";
						state.message = "Global scoreboard offline — score saved on this device.";
						return;
					}

					window.ArcadeScores.submit(GAME_ID, {
						runId: runId || undefined,
						name: String(name),
						score: cleanScore,
						board: board || "main",
						meta: meta
					}).then(function (res) {
						state.done = true;
						if (res && res.ok) {
							saveLocalEntry(localEntry);
							state.ok = true;
							state.rank = Number(res.rank) || 0;
							state.message = state.rank > 0 ? ("Global rank #" + state.rank) : "Score submitted!";
						} else {
							const err = (res && res.error) ? String(res.error) : "invalid";
							state.ok = false;
							state.error = err;
							if (err === "offline") {
								saveLocalEntry(localEntry);
								state.message = "Global scoreboard offline — score saved on this device.";
							} else {
								state.message = fallbackMessage(err);
							}
						}
					}).catch(function () {
						saveLocalEntry(localEntry);
						state.done = true;
						state.ok = false;
						state.error = "offline";
						state.message = "Global scoreboard offline — score saved on this device.";
					});
				},

				pollSubmit: function () {
					return JSON.stringify(bridge._submitState);
				}
			};
			return bridge;
		})();
	</script>

	<script src="index.js"></script>
	<script>
		const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":3465808,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
		const engine = new Engine(GODOT_CONFIG);

		// Fullscreen bridge. Browsers only allow fullscreen *during* a key press or tap,
		// but Godot handles input a frame later. So the game sets bondFullscreen.want
		// (true / false) and the next key / mouse / touch event applies it here. The game
		// queues `true` at start-up (fullscreen by default), so the first input enters
		// fullscreen. A refused request stays queued so the next input tries again.
		window.bondFullscreen = { want: null, busy: false };
		function bondApplyFullscreen() {
			const fs = window.bondFullscreen;
			if (fs.want === null || fs.busy) { return; }
			const want = fs.want;
			const canvas = document.getElementById("canvas");
			const current = document.fullscreenElement || document.webkitFullscreenElement;
			if (want === !!current) { fs.want = null; return; }
			let p = null;
			try {
				if (want) {
					const req = canvas.requestFullscreen || canvas.webkitRequestFullscreen;
					p = req ? req.call(canvas, { navigationUI: "hide" }) : null;
				} else {
					const exit = document.exitFullscreen || document.webkitExitFullscreen;
					p = exit ? exit.call(document) : null;
				}
			} catch (e) { return; }
			if (p && p.then) {
				fs.busy = true;
				p.then(function () { fs.busy = false; if (fs.want === want) { fs.want = null; } },
					function () { fs.busy = false; });
			} else {
				fs.want = null;
			}
		}
		["keydown", "keyup", "mousedown", "mouseup", "pointerdown", "pointerup", "touchend", "click"].forEach(function (t) {
			window.addEventListener(t, bondApplyFullscreen, true);
		});

		(function () {
			const statusOverlay = document.getElementById("status");
			const statusProgress = document.getElementById("status-progress");
			const statusNotice = document.getElementById("status-notice");
			const statusLabel = document.getElementById("status-label");
			const barWrap = document.getElementById("ea-bar-wrap");

			function setNotice(text) {
				statusNotice.style.display = "block";
				statusNotice.textContent = text;
				barWrap.style.display = "none";
			}

			const missing = Engine.getMissingFeatures({
				threads: false
			});

			if (missing.length !== 0) {
				setNotice(
					"WebAssembly launch blocked — missing browser features:\n" + missing.join("\n")
				);
				return;
			}

			engine.startGame({
				onProgress: function (current, total) {
					if (current > 0 && total > 0) {
						const pct = Math.min(100, Math.round((current / total) * 100));
						statusProgress.style.width = pct + "%";
						statusLabel.textContent = "Loading Octet Engine (" + pct + "%)...";
					} else {
						statusProgress.style.width = "65%";
					}
				}
			}).then(function () {
				statusOverlay.style.display = "none";
			}, function (err) {
				console.error(err);
				setNotice(err instanceof Error ? err.message : String(err));
			});
		})();
	</script>
