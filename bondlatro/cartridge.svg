<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" width="220" height="220">
  <defs>
    <!-- Deep emerald-teal lab felt shell with emerald/gold highlight -->
    <linearGradient id="bl-shell" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#102c28" />
      <stop offset="55%" stop-color="#09181a" />
      <stop offset="100%" stop-color="#040b0e" />
    </linearGradient>
    <linearGradient id="bl-shell-edge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="bl-label" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040b0e" />
      <stop offset="55%" stop-color="#0b2421" />
      <stop offset="100%" stop-color="#1c1908" />
    </linearGradient>
    <linearGradient id="bl-gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#a16207" />
    </linearGradient>
    <linearGradient id="bl-spade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="55%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="bl-card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff8e6" />
      <stop offset="100%" stop-color="#dfd3b5" />
    </linearGradient>
    <filter id="bl-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Ambient Drop Shadow -->
  <rect x="28" y="14" width="164" height="174" rx="10" fill="#020408" opacity="0.82" />

  <!-- Bottom PCB Connector Housing -->
  <rect x="44" y="176" width="132" height="28" rx="4" fill="#071315" stroke="#34d399" stroke-width="2" />
  <rect x="50" y="180" width="120" height="22" rx="2" fill="#062e1e" stroke="#f59e0b" stroke-width="1" />

  <!-- Gold Edge Connector Pins -->
  <g fill="url(#bl-gold)">
    <rect x="55" y="182" width="6" height="19" rx="1" />
    <rect x="65" y="182" width="6" height="19" rx="1" />
    <rect x="75" y="182" width="6" height="19" rx="1" />
    <rect x="85" y="182" width="6" height="19" rx="1" />
    <rect x="95" y="182" width="6" height="19" rx="1" />
    <rect x="105" y="182" width="6" height="19" rx="1" />
    <rect x="115" y="182" width="6" height="19" rx="1" />
    <rect x="125" y="182" width="6" height="19" rx="1" />
    <rect x="135" y="182" width="6" height="19" rx="1" />
    <rect x="145" y="182" width="6" height="19" rx="1" />
    <rect x="155" y="182" width="6" height="19" rx="1" />
    <rect x="163" y="182" width="4" height="19" rx="1" />
  </g>

  <!-- Main Cartridge Body with Left Notch -->
  <path d="M 38 14 H 180 A 8 8 0 0 1 188 22 V 174 A 6 6 0 0 1 182 180 H 38 A 6 6 0 0 1 32 174 V 32 L 44 20 V 14 Z"
        fill="url(#bl-shell)" stroke="url(#bl-shell-edge)" stroke-width="2.5" />

  <!-- Top Grip Spine Ribs -->
  <rect x="52" y="18" width="124" height="18" rx="3" fill="#061113" stroke="#047857" stroke-width="1" />
  <g stroke="#34d399" stroke-width="1.8" stroke-linecap="round">
    <line x1="60" y1="22" x2="168" y2="22" />
    <line x1="60" y1="27" x2="168" y2="27" />
    <line x1="60" y1="32" x2="168" y2="32" />
  </g>

  <!-- Side Grip Grooves -->
  <g fill="#050c0e" stroke="#047857" stroke-width="0.8">
    <rect x="33" y="52" width="7" height="5" rx="1" />
    <rect x="33" y="62" width="7" height="5" rx="1" />
    <rect x="33" y="72" width="7" height="5" rx="1" />
    <rect x="33" y="82" width="7" height="5" rx="1" />
    <rect x="180" y="52" width="7" height="5" rx="1" />
    <rect x="180" y="62" width="7" height="5" rx="1" />
    <rect x="180" y="72" width="7" height="5" rx="1" />
    <rect x="180" y="82" width="7" height="5" rx="1" />
  </g>

  <!-- Security Screws -->
  <g fill="#475569" stroke="#cbd5e1" stroke-width="1">
    <circle cx="43" cy="166" r="4.5" />
    <line x1="40.5" y1="166" x2="45.5" y2="166" stroke="#0f172a" stroke-width="1.4" />
    <circle cx="177" cy="166" r="4.5" />
    <line x1="174.5" y1="166" x2="179.5" y2="166" stroke="#0f172a" stroke-width="1.4" />
  </g>

  <!-- Recessed Center Label Well + Sticker -->
  <rect x="46" y="42" width="128" height="114" rx="6" fill="#03080a" stroke="#34d399" stroke-width="1.5" />
  <rect x="49" y="45" width="122" height="108" rx="4" fill="url(#bl-label)" stroke="#f59e0b" stroke-width="1.3" />

  <!-- Top Sticker Header Band -->
  <path d="M 50 49 A 3 3 0 0 1 53 46 H 167 A 3 3 0 0 1 170 49 V 61 H 50 Z" fill="#f59e0b" />
  <text x="110" y="56.5" text-anchor="middle" fill="#071214" font-family="monospace" font-weight="900" font-size="9" letter-spacing="1.6">BONDLATRO</text>

  <!-- Fanned Mini Element Card Corners Behind Hexagon -->
  <g transform="rotate(-14 78 112)">
    <rect x="63" y="88" width="26" height="36" rx="3" fill="url(#bl-card)" stroke="#10b981" stroke-width="1.2" />
    <rect x="65" y="90" width="22" height="3" rx="1" fill="#10b981" />
    <text x="69" y="101" fill="#0f172a" font-family="monospace" font-weight="900" font-size="7.5">C</text>
  </g>
  <g transform="rotate(14 142 112)">
    <rect x="131" y="88" width="26" height="36" rx="3" fill="url(#bl-card)" stroke="#a855f7" stroke-width="1.2" />
    <rect x="133" y="90" width="22" height="3" rx="1" fill="#a855f7" />
    <text x="150" y="101" text-anchor="end" fill="#0f172a" font-family="monospace" font-weight="900" font-size="7.5">F</text>
  </g>

  <!-- Electron Orbital Arcs -->
  <g fill="none" stroke-width="1.8" opacity="0.92" filter="url(#bl-glow)">
    <ellipse cx="110" cy="103" rx="34" ry="15" transform="rotate(-28 110 103)" stroke="#22d3ee" />
    <ellipse cx="110" cy="103" rx="34" ry="15" transform="rotate(28 110 103)" stroke="#34d399" />
  </g>

  <!-- Central Golden Molecular Hexagon Ring -->
  <polygon points="110,77 132.5,90 132.5,116 110,129 87.5,116 87.5,90"
           fill="#06191a" fill-opacity="0.9" stroke="url(#bl-gold)" stroke-width="3" stroke-linejoin="round" filter="url(#bl-glow)" />
  <polygon points="110,82 128,92.5 128,113.5 110,124 92,113.5 92,92.5"
           fill="none" stroke="#fde68a" stroke-width="0.9" stroke-opacity="0.7" />

  <!-- Glowing Atomic Vertex Nodes -->
  <g fill="#fef9c3" stroke="#d97706" stroke-width="1.2">
    <circle cx="110" cy="77" r="3.4" />
    <circle cx="132.5" cy="90" r="3.4" />
    <circle cx="132.5" cy="116" r="3.4" />
    <circle cx="110" cy="129" r="3.4" />
    <circle cx="87.5" cy="116" r="3.4" />
    <circle cx="87.5" cy="90" r="3.4" />
  </g>

  <!-- Central Emerald-and-Gold Spade Crest -->
  <path d="M 110 89 C 103 97 98 102 98 107.5 A 6.2 6.2 0 0 0 108.4 112 L 106 117.5 H 114 L 111.6 112 A 6.2 6.2 0 0 0 122 107.5 C 122 102 117 97 110 89 Z"
        fill="url(#bl-spade)" stroke="#fde68a" stroke-width="1.3" stroke-linejoin="round" />

  <!-- Orbiting Electrons -->
  <circle cx="83" cy="88" r="2.6" fill="#67e8f9" filter="url(#bl-glow)" />
  <circle cx="137" cy="118" r="2.6" fill="#6ee7b7" filter="url(#bl-glow)" />

  <!-- Corner Arcade Chemistry Badges -->
  <g transform="translate(53, 65)">
    <rect x="0" y="0" width="29" height="14" rx="3" fill="#062230" stroke="#22d3ee" stroke-width="1" />
    <text x="14.5" y="9.8" text-anchor="middle" fill="#67e8f9" font-family="monospace" font-weight="900" font-size="7.2">M×V</text>
  </g>
  <g transform="translate(138, 65)">
    <rect x="0" y="0" width="29" height="14" rx="3" fill="#291804" stroke="#f59e0b" stroke-width="1" />
    <text x="14.5" y="9.6" text-anchor="middle" fill="#fde047" font-family="monospace" font-weight="900" font-size="7.5">E<tspan dy="1.8" font-size="5.4">a</tspan></text>
  </g>

  <!-- Bottom ROM Serial Badge on Sticker -->
  <rect x="55" y="144" width="110" height="7" rx="2" fill="#040b0e" stroke="#34d399" stroke-width="0.8" />
  <text x="110" y="149.6" text-anchor="middle" fill="#fde047" font-family="monospace" font-weight="bold" font-size="5.6" letter-spacing="0.8">ALX-10 • OCTET ENGINE</text>

  <!-- Molded Downward Insertion Triangle -->
  <polygon points="103,163 117,163 110,172" fill="#047857" stroke="#34d399" stroke-width="1" />
</svg>
