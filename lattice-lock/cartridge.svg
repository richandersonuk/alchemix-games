<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" width="220" height="220">
  <defs>
    <!-- Crystalline Obsidian & Ice-Cyan / Amethyst Cartridge Shell -->
    <linearGradient id="ll-shell" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#132a3b" />
      <stop offset="55%" stop-color="#0a1626" />
      <stop offset="100%" stop-color="#050a14" />
    </linearGradient>
    <linearGradient id="ll-shell-edge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a5f3fc" />
      <stop offset="50%" stop-color="#a78bfa" />
      <stop offset="100%" stop-color="#0e7490" />
    </linearGradient>
    <!-- Sticker Label Gradient -->
    <linearGradient id="ll-label" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050a14" />
      <stop offset="55%" stop-color="#0f1c33" />
      <stop offset="100%" stop-color="#1c1238" />
    </linearGradient>
    <!-- Gold PCB Pins Gradient -->
    <linearGradient id="ll-gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#a16207" />
    </linearGradient>
    <!-- Core Crystal Gradient -->
    <linearGradient id="ll-crystal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ecfeff" />
      <stop offset="50%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#0e7490" />
    </linearGradient>
    <radialGradient id="ll-na" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ddd6fe" />
      <stop offset="100%" stop-color="#7c3aed" />
    </radialGradient>
    <radialGradient id="ll-cl" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#bbf7d0" />
      <stop offset="100%" stop-color="#16a34a" />
    </radialGradient>
    <filter id="ll-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Ambient Drop Shadow -->
  <rect x="28" y="14" width="164" height="174" rx="10" fill="#02040a" opacity="0.8" />

  <!-- Bottom PCB Connector Housing -->
  <rect x="44" y="176" width="132" height="28" rx="4" fill="#070d1c" stroke="#22d3ee" stroke-width="2" />
  <rect x="50" y="180" width="120" height="22" rx="2" fill="#062e2a" stroke="#a78bfa" stroke-width="1" />

  <!-- Gold Edge Connector Pins -->
  <g fill="url(#ll-gold)">
    <rect x="55" y="182" width="6" height="19" rx="1" />
    <rect x="65" y="182" width="6" height="19" rx="1" />
    <rect x="75" y="182" width="6" height="19" rx="1" />
    <rect x="85" y="182" width="6" height="19" rx="1" />
    <rect x="95" y="182" width="6" height="19" rx="1" />
    <rect x="105" y="182" width="6" height="19" rx="1" />
    <rect x="115" y="182" width="6" height="19" rx="1" />
    <rect x="125" y="182" width="6" height="19" rx="1" />
    <rect x="135" y="182" width="6" height="19" rx="1" />
    <rect x="145" y="182" width="6" height="19" rx="1" />
    <rect x="155" y="182" width="6" height="19" rx="1" />
    <rect x="163" y="182" width="4" height="19" rx="1" />
  </g>

  <!-- Main Cartridge Body with Left Notch -->
  <path d="M 38 14
           H 180
           A 8 8 0 0 1 188 22
           V 174
           A 6 6 0 0 1 182 180
           H 38
           A 6 6 0 0 1 32 174
           V 32
           L 44 20
           V 14 Z"
        fill="url(#ll-shell)"
        stroke="url(#ll-shell-edge)"
        stroke-width="2.5" />

  <!-- Top Grip Spine Ribs -->
  <rect x="52" y="18" width="124" height="18" rx="3" fill="#060b18" stroke="#0891b2" stroke-width="1" />
  <g stroke="#67e8f9" stroke-width="1.8" stroke-linecap="round">
    <line x1="60" y1="22" x2="168" y2="22" />
    <line x1="60" y1="27" x2="168" y2="27" />
    <line x1="60" y1="32" x2="168" y2="32" />
  </g>

  <!-- Side Grip Grooves -->
  <g fill="#050814" stroke="#0891b2" stroke-width="0.8">
    <rect x="33" y="52" width="7" height="5" rx="1" />
    <rect x="33" y="62" width="7" height="5" rx="1" />
    <rect x="33" y="72" width="7" height="5" rx="1" />
    <rect x="33" y="82" width="7" height="5" rx="1" />
    <rect x="180" y="52" width="7" height="5" rx="1" />
    <rect x="180" y="62" width="7" height="5" rx="1" />
    <rect x="180" y="72" width="7" height="5" rx="1" />
    <rect x="180" y="82" width="7" height="5" rx="1" />
  </g>

  <!-- Security Screws -->
  <g fill="#475569" stroke="#cbd5e1" stroke-width="1">
    <circle cx="43" cy="166" r="4.5" />
    <line x1="40.5" y1="166" x2="45.5" y2="166" stroke="#0f172a" stroke-width="1.4" />
    <circle cx="177" cy="166" r="4.5" />
    <line x1="174.5" y1="166" x2="179.5" y2="166" stroke="#0f172a" stroke-width="1.4" />
  </g>

  <!-- Recessed Center Label Well -->
  <rect x="46" y="42" width="128" height="114" rx="6" fill="#03050c" stroke="#0891b2" stroke-width="1.5" />

  <!-- Glossy Cartridge Label Sticker -->
  <rect x="49" y="45" width="122" height="108" rx="4" fill="url(#ll-label)" stroke="#67e8f9" stroke-width="1.3" />

  <!-- Top Sticker Header Band -->
  <path d="M 50 49 A 3 3 0 0 1 53 46 H 167 A 3 3 0 0 1 170 49 V 61 H 50 Z" fill="#22d3ee" />
  <text x="110" y="56.5" text-anchor="middle" fill="#050814" font-family="monospace" font-weight="900" font-size="9.2" letter-spacing="1.6">LATTICE LOCK</text>

  <!-- Isometric rock-salt (NaCl) lattice: 3 × 3 × 2 ions -->
  <g transform="translate(110, 99)">
    <!-- ionic bonds: back layer -->
    <g stroke="#94a3b8" stroke-width="1.2" opacity="0.55">
      <path d="M -26 -27 L 0 -40 L 26 -27 M -26 -27 L 0 -14 L 26 -27 M 0 -40 L 0 -14" />
    </g>
    <!-- vertical bonds -->
    <g stroke="#94a3b8" stroke-width="1.2" opacity="0.7">
      <line x1="-26" y1="-27" x2="-26" y2="3" />
      <line x1="26" y1="-27" x2="26" y2="3" />
      <line x1="0" y1="-14" x2="0" y2="16" />
      <line x1="0" y1="-40" x2="0" y2="-10" opacity="0.5" />
    </g>
    <!-- ionic bonds: front layer -->
    <g stroke="#cbd5e1" stroke-width="1.4">
      <path d="M -26 3 L 0 -10 L 26 3 M -26 3 L 0 16 L 26 3 M -13 -3.5 L 13 9.5 M 13 -3.5 L -13 9.5" />
    </g>
    <!-- back layer ions -->
    <circle cx="0" cy="-40" r="5.5" fill="url(#ll-cl)" />
    <circle cx="-26" cy="-27" r="4.2" fill="url(#ll-na)" />
    <circle cx="26" cy="-27" r="4.2" fill="url(#ll-na)" />
    <circle cx="0" cy="-14" r="5.5" fill="url(#ll-cl)" />
    <!-- front layer ions -->
    <circle cx="0" cy="-10" r="4.2" fill="url(#ll-na)" />
    <circle cx="-26" cy="3" r="6" fill="url(#ll-cl)" />
    <circle cx="26" cy="3" r="6" fill="url(#ll-cl)" />
    <circle cx="-13" cy="-3.5" r="4.4" fill="url(#ll-na)" />
    <circle cx="13" cy="-3.5" r="4.4" fill="url(#ll-na)" />
    <circle cx="0" cy="3" r="6.2" fill="url(#ll-cl)" />
    <circle cx="-13" cy="9.5" r="4.4" fill="url(#ll-na)" />
    <circle cx="13" cy="9.5" r="4.4" fill="url(#ll-na)" />
    <circle cx="0" cy="16" r="6" fill="url(#ll-cl)" />
  </g>

  <!-- Defended core crystal (right) with incoming plasma orb (left) -->
  <g transform="translate(152, 112)" filter="url(#ll-glow)">
    <polygon points="0,-12 7,-3 0,12 -7,-3" fill="url(#ll-crystal)" stroke="#ecfeff" stroke-width="0.8" />
  </g>
  <g transform="translate(66, 116)">
    <circle r="6.5" fill="#fb923c" opacity="0.35" filter="url(#ll-glow)" />
    <circle r="3.2" fill="#fff7ed" />
  </g>
  <path d="M 70 128 Q 110 136 148 126" fill="none" stroke="#22d3ee" stroke-width="1" stroke-dasharray="3 3" opacity="0.7" />

  <!-- Bottom ROM Serial Badge on Sticker -->
  <rect x="55" y="136" width="110" height="12" rx="2" fill="#050814" stroke="#a78bfa" stroke-width="1" />
  <text x="110" y="144.5" text-anchor="middle" fill="#67e8f9" font-family="monospace" font-weight="bold" font-size="7" letter-spacing="0.8">ALX-07 • CRYSTAL DEF</text>

  <!-- Molded Downward Insertion Triangle on Cartridge Shell -->
  <polygon points="103,163 117,163 110,172" fill="#0891b2" stroke="#22d3ee" stroke-width="1" />
</svg>
