<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" width="220" height="220">
  <defs>
    <!-- Quantum Deep Navy & Cyan Cartridge Shell -->
    <linearGradient id="ob-shell" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f294a" />
      <stop offset="55%" stop-color="#0a1930" />
      <stop offset="100%" stop-color="#050d1a" />
    </linearGradient>
    <linearGradient id="ob-shell-edge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <!-- Sticker Label Gradient -->
    <linearGradient id="ob-label" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040914" />
      <stop offset="50%" stop-color="#0c1e3e" />
      <stop offset="100%" stop-color="#062c30" />
    </linearGradient>
    <!-- Gold PCB Pins Gradient -->
    <linearGradient id="ob-gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#a16207" />
    </linearGradient>
    <filter id="ob-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Ambient Drop Shadow -->
  <rect x="28" y="14" width="164" height="174" rx="10" fill="#020611" opacity="0.75" />

  <!-- Bottom PCB Connector Housing -->
  <rect x="44" y="176" width="132" height="28" rx="4" fill="#071326" stroke="#38bdf8" stroke-width="2" />
  <rect x="50" y="180" width="120" height="22" rx="2" fill="#062e1e" stroke="#34d399" stroke-width="1" />

  <!-- Gold Edge Connector Pins -->
  <g fill="url(#ob-gold)">
    <rect x="55" y="182" width="6" height="19" rx="1" />
    <rect x="65" y="182" width="6" height="19" rx="1" />
    <rect x="75" y="182" width="6" height="19" rx="1" />
    <rect x="85" y="182" width="6" height="19" rx="1" />
    <rect x="95" y="182" width="6" height="19" rx="1" />
    <rect x="105" y="182" width="6" height="19" rx="1" />
    <rect x="115" y="182" width="6" height="19" rx="1" />
    <rect x="125" y="182" width="6" height="19" rx="1" />
    <rect x="135" y="182" width="6" height="19" rx="1" />
    <rect x="145" y="182" width="6" height="19" rx="1" />
    <rect x="155" y="182" width="6" height="19" rx="1" />
    <rect x="163" y="182" width="4" height="19" rx="1" />
  </g>

  <!-- Main Cartridge Body with Left Notch -->
  <path d="M 38 14
           H 180
           A 8 8 0 0 1 188 22
           V 174
           A 6 6 0 0 1 182 180
           H 38
           A 6 6 0 0 1 32 174
           V 32
           L 44 20
           V 14 Z"
        fill="url(#ob-shell)"
        stroke="url(#ob-shell-edge)"
        stroke-width="2.5" />

  <!-- Top Grip Spine Ribs -->
  <rect x="52" y="18" width="124" height="18" rx="3" fill="#071529" stroke="#0284c7" stroke-width="1" />
  <g stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round">
    <line x1="60" y1="22" x2="168" y2="22" />
    <line x1="60" y1="27" x2="168" y2="27" />
    <line x1="60" y1="32" x2="168" y2="32" />
  </g>

  <!-- Side Grip Grooves -->
  <g fill="#050e1d" stroke="#0284c7" stroke-width="0.8">
    <rect x="33" y="52" width="7" height="5" rx="1" />
    <rect x="33" y="62" width="7" height="5" rx="1" />
    <rect x="33" y="72" width="7" height="5" rx="1" />
    <rect x="33" y="82" width="7" height="5" rx="1" />
    <rect x="180" y="52" width="7" height="5" rx="1" />
    <rect x="180" y="62" width="7" height="5" rx="1" />
    <rect x="180" y="72" width="7" height="5" rx="1" />
    <rect x="180" y="82" width="7" height="5" rx="1" />
  </g>

  <!-- Corner Security Screws -->
  <g fill="#475569" stroke="#94a3b8" stroke-width="1">
    <circle cx="43" cy="166" r="4.5" />
    <line x1="40.5" y1="166" x2="45.5" y2="166" stroke="#0f172a" stroke-width="1.4" />
    <circle cx="177" cy="166" r="4.5" />
    <line x1="174.5" y1="166" x2="179.5" y2="166" stroke="#0f172a" stroke-width="1.4" />
  </g>

  <!-- Recessed Center Label Well -->
  <rect x="46" y="42" width="128" height="114" rx="6" fill="#030812" stroke="#0284c7" stroke-width="1.5" />

  <!-- Glossy Cartridge Label Sticker -->
  <rect x="49" y="45" width="122" height="108" rx="4" fill="url(#ob-label)" stroke="#38bdf8" stroke-width="1.2" />

  <!-- Top Sticker Header Band -->
  <path d="M 50 49 A 3 3 0 0 1 53 46 H 167 A 3 3 0 0 1 170 49 V 61 H 50 Z" fill="#0ea5e9" />
  <text x="110" y="56.5" text-anchor="middle" fill="#040914" font-family="monospace" font-weight="900" font-size="8.8" letter-spacing="1.4">ORBITAL BLITZ</text>

  <!-- 3D Atomic Orbital Rings (Left Side of Label) -->
  <g transform="translate(82, 92)">
    <ellipse rx="24" ry="9" transform="rotate(-30)" fill="none" stroke="#38bdf8" stroke-width="1.6" />
    <ellipse rx="24" ry="9" transform="rotate(30)" fill="none" stroke="#34d399" stroke-width="1.6" />
    <ellipse rx="24" ry="9" transform="rotate(90)" fill="none" stroke="#a78bfa" stroke-width="1.6" />
    <circle r="5" fill="#fbbf24" filter="url(#ob-glow)" />
    <!-- Orbiting Electrons -->
    <circle cx="20" cy="-11" r="2.8" fill="#38bdf8" filter="url(#ob-glow)" />
    <circle cx="-19" cy="-11" r="2.8" fill="#34d399" filter="url(#ob-glow)" />
    <circle cx="0" cy="24" r="2.8" fill="#a78bfa" filter="url(#ob-glow)" />
  </g>

  <!-- Hund's Rule Orbital Spin Boxes (Right Side of Label) -->
  <g transform="translate(116, 68)">
    <text x="23" y="8" text-anchor="middle" fill="#7dd3fc" font-family="monospace" font-weight="bold" font-size="7.5">3d⁵ 4s¹</text>
    <!-- Box 1: Paired Spins ↑↓ -->
    <rect x="0" y="12" width="21" height="24" rx="3" fill="#0b192e" stroke="#38bdf8" stroke-width="1.4" />
    <path d="M 7 32 V 16 L 4 20 M 14 16 V 32 L 17 28" fill="none" stroke="#38bdf8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Box 2: Single Spin ↑ -->
    <rect x="25" y="12" width="21" height="24" rx="3" fill="#0a2629" stroke="#34d399" stroke-width="1.4" />
    <path d="M 35 32 V 16 L 32 20" fill="none" stroke="#34d399" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Subshell Label Badge -->
    <rect x="0" y="40" width="46" height="14" rx="3" fill="#112240" stroke="#a78bfa" stroke-width="1" />
    <text x="23" y="49.5" text-anchor="middle" fill="#e0f2fe" font-family="monospace" font-weight="bold" font-size="8">1s²2s²2p⁶</text>
  </g>

  <!-- Bottom ROM Serial Badge on Sticker -->
  <rect x="55" y="136" width="110" height="12" rx="2" fill="#040b18" stroke="#38bdf8" stroke-width="1" />
  <text x="110" y="144.5" text-anchor="middle" fill="#34d399" font-family="monospace" font-weight="bold" font-size="7" letter-spacing="0.8">ALX-03 • QUANTUM ROM</text>

  <!-- Molded Downward Insertion Triangle on Cartridge Shell -->
  <polygon points="103,163 117,163 110,172" fill="#0284c7" stroke="#38bdf8" stroke-width="1" />
</svg>
