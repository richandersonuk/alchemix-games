<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" width="220" height="220">
  <defs>
    <!-- Gunmetal checkpoint shell with CRT-green / ink-red edge -->
    <linearGradient id="ss-shell" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#262b2e" />
      <stop offset="55%" stop-color="#15191b" />
      <stop offset="100%" stop-color="#090b0c" />
    </linearGradient>
    <linearGradient id="ss-shell-edge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7dff9a" />
      <stop offset="50%" stop-color="#ffb000" />
      <stop offset="100%" stop-color="#a3361b" />
    </linearGradient>
    <linearGradient id="ss-gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#a16207" />
    </linearGradient>
    <radialGradient id="ss-crt" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#0a2a17" />
      <stop offset="100%" stop-color="#020a05" />
    </radialGradient>
    <linearGradient id="ss-paper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e3d8bb" />
      <stop offset="100%" stop-color="#c9bc98" />
    </linearGradient>
    <pattern id="ss-scan" width="4" height="3" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#000" opacity="0.35" />
    </pattern>
    <filter id="ss-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Ambient Drop Shadow -->
  <rect x="28" y="14" width="164" height="174" rx="10" fill="#020408" opacity="0.8" />

  <!-- Bottom PCB Connector Housing -->
  <rect x="44" y="176" width="132" height="28" rx="4" fill="#0b0d0e" stroke="#7dff9a" stroke-width="2" />
  <rect x="50" y="180" width="120" height="22" rx="2" fill="#062e1e" stroke="#ffb000" stroke-width="1" />

  <!-- Gold Edge Connector Pins -->
  <g fill="url(#ss-gold)">
    <rect x="55" y="182" width="6" height="19" rx="1" />
    <rect x="65" y="182" width="6" height="19" rx="1" />
    <rect x="75" y="182" width="6" height="19" rx="1" />
    <rect x="85" y="182" width="6" height="19" rx="1" />
    <rect x="95" y="182" width="6" height="19" rx="1" />
    <rect x="105" y="182" width="6" height="19" rx="1" />
    <rect x="115" y="182" width="6" height="19" rx="1" />
    <rect x="125" y="182" width="6" height="19" rx="1" />
    <rect x="135" y="182" width="6" height="19" rx="1" />
    <rect x="145" y="182" width="6" height="19" rx="1" />
    <rect x="155" y="182" width="6" height="19" rx="1" />
    <rect x="163" y="182" width="4" height="19" rx="1" />
  </g>

  <!-- Main Cartridge Body with Left Notch -->
  <path d="M 38 14 H 180 A 8 8 0 0 1 188 22 V 174 A 6 6 0 0 1 182 180 H 38 A 6 6 0 0 1 32 174 V 32 L 44 20 V 14 Z"
        fill="url(#ss-shell)" stroke="url(#ss-shell-edge)" stroke-width="2.5" />

  <!-- Top Grip Spine Ribs -->
  <rect x="52" y="18" width="124" height="18" rx="3" fill="#0b0d0e" stroke="#3f4a4f" stroke-width="1" />
  <g stroke="#7dff9a" stroke-width="1.8" stroke-linecap="round" opacity="0.8">
    <line x1="60" y1="22" x2="168" y2="22" />
    <line x1="60" y1="27" x2="168" y2="27" />
    <line x1="60" y1="32" x2="168" y2="32" />
  </g>

  <!-- Side Grip Grooves -->
  <g fill="#060808" stroke="#3f4a4f" stroke-width="0.8">
    <rect x="33" y="52" width="7" height="5" rx="1" />
    <rect x="33" y="62" width="7" height="5" rx="1" />
    <rect x="33" y="72" width="7" height="5" rx="1" />
    <rect x="33" y="82" width="7" height="5" rx="1" />
    <rect x="180" y="52" width="7" height="5" rx="1" />
    <rect x="180" y="62" width="7" height="5" rx="1" />
    <rect x="180" y="72" width="7" height="5" rx="1" />
    <rect x="180" y="82" width="7" height="5" rx="1" />
  </g>

  <!-- Security Screws -->
  <g fill="#475569" stroke="#cbd5e1" stroke-width="1">
    <circle cx="43" cy="166" r="4.5" />
    <line x1="40.5" y1="166" x2="45.5" y2="166" stroke="#0f172a" stroke-width="1.4" />
    <circle cx="177" cy="166" r="4.5" />
    <line x1="174.5" y1="166" x2="179.5" y2="166" stroke="#0f172a" stroke-width="1.4" />
  </g>

  <!-- Recessed Center Label Well + weathered paper sticker -->
  <rect x="46" y="42" width="128" height="114" rx="6" fill="#04060c" stroke="#7dff9a" stroke-width="1.5" />
  <rect x="49" y="45" width="122" height="108" rx="4" fill="url(#ss-paper)" stroke="#ffb000" stroke-width="1.2" />
  <!-- coffee ring -->
  <circle cx="150" cy="134" r="15" fill="none" stroke="#6e4619" stroke-width="2.2" opacity="0.22" />

  <!-- Top Sticker Header Band -->
  <path d="M 50 49 A 3 3 0 0 1 53 46 H 167 A 3 3 0 0 1 170 49 V 61 H 50 Z" fill="#1d2326" />
  <text x="110" y="56.8" text-anchor="middle" fill="#ffb000" font-family="monospace" font-weight="900" font-size="8" letter-spacing="1.4">SPECTRA SLEUTH</text>

  <!-- Label art: a CRT showing an IR spectrum with a C=O trough -->
  <rect x="56" y="66" width="108" height="58" rx="6" fill="#0b0c0d" />
  <rect x="59" y="69" width="102" height="52" rx="5" fill="url(#ss-crt)" />
  <g stroke="#7dff9a" stroke-opacity="0.12" stroke-width="0.6">
    <line x1="76" y1="70" x2="76" y2="120" />
    <line x1="93" y1="70" x2="93" y2="120" />
    <line x1="110" y1="70" x2="110" y2="120" />
    <line x1="127" y1="70" x2="127" y2="120" />
    <line x1="144" y1="70" x2="144" y2="120" />
  </g>
  <path filter="url(#ss-glow)" fill="none" stroke="#7dff9a" stroke-width="1.6" stroke-linejoin="round"
        d="M 61 76 L 72 77 C 75 77, 76 96, 79 98 C 82 96, 83 79, 86 78 L 92 79 L 94 90 L 96 79 L 108 80 L 111 81 C 113 82, 114 113, 116 114 C 118 113, 119 83, 121 82 L 127 83 L 129 95 L 131 85 L 136 92 L 139 84 L 144 100 L 147 86 L 151 94 L 154 84 L 159 86" />
  <!-- inspector's ring around the carbonyl trough -->
  <circle cx="116" cy="112" r="6" fill="none" stroke="#ff4d4d" stroke-width="1.4" />
  <rect x="59" y="69" width="102" height="52" rx="5" fill="url(#ss-scan)" />
  <text x="116" y="78" text-anchor="middle" fill="#ffb000" font-family="monospace" font-size="5.5" font-weight="700">C=O 1715</text>

  <!-- Rubber stamp impression -->
  <g transform="rotate(-9 86 140)">
    <rect x="58" y="131" width="58" height="17" rx="2" fill="none" stroke="#a3361b" stroke-width="2" opacity="0.88" />
    <text x="87" y="143.5" text-anchor="middle" fill="#a3361b" font-family="monospace" font-weight="900" font-size="9" letter-spacing="1.2" opacity="0.88">REJECTED</text>
  </g>
</svg>
