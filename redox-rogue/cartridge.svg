<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" width="220" height="220">
  <defs>
    <!-- High-Voltage Obsidian & Cyan-Violet Cartridge Shell -->
    <linearGradient id="rr-shell" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#13223b" />
      <stop offset="55%" stop-color="#0a1224" />
      <stop offset="100%" stop-color="#050814" />
    </linearGradient>
    <linearGradient id="rr-shell-edge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="55%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#0e7490" />
    </linearGradient>
    <!-- Sticker Label Gradient -->
    <linearGradient id="rr-label" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814" />
      <stop offset="50%" stop-color="#111936" />
      <stop offset="100%" stop-color="#24103a" />
    </linearGradient>
    <!-- Gold PCB Pins Gradient -->
    <linearGradient id="rr-gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#a16207" />
    </linearGradient>
    <!-- Electric Cyan-to-Violet Bolt Gradient -->
    <linearGradient id="rr-bolt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="55%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="rr-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Ambient Drop Shadow -->
  <rect x="28" y="14" width="164" height="174" rx="10" fill="#02040a" opacity="0.8" />

  <!-- Bottom PCB Connector Housing -->
  <rect x="44" y="176" width="132" height="28" rx="4" fill="#070d1c" stroke="#22d3ee" stroke-width="2" />
  <rect x="50" y="180" width="120" height="22" rx="2" fill="#062e1e" stroke="#a855f7" stroke-width="1" />

  <!-- Gold Edge Connector Pins -->
  <g fill="url(#rr-gold)">
    <rect x="55" y="182" width="6" height="19" rx="1" />
    <rect x="65" y="182" width="6" height="19" rx="1" />
    <rect x="75" y="182" width="6" height="19" rx="1" />
    <rect x="85" y="182" width="6" height="19" rx="1" />
    <rect x="95" y="182" width="6" height="19" rx="1" />
    <rect x="105" y="182" width="6" height="19" rx="1" />
    <rect x="115" y="182" width="6" height="19" rx="1" />
    <rect x="125" y="182" width="6" height="19" rx="1" />
    <rect x="135" y="182" width="6" height="19" rx="1" />
    <rect x="145" y="182" width="6" height="19" rx="1" />
    <rect x="155" y="182" width="6" height="19" rx="1" />
    <rect x="163" y="182" width="4" height="19" rx="1" />
  </g>

  <!-- Main Cartridge Body with Left Notch -->
  <path d="M 38 14
           H 180
           A 8 8 0 0 1 188 22
           V 174
           A 6 6 0 0 1 182 180
           H 38
           A 6 6 0 0 1 32 174
           V 32
           L 44 20
           V 14 Z"
        fill="url(#rr-shell)"
        stroke="url(#rr-shell-edge)"
        stroke-width="2.5" />

  <!-- Top Grip Spine Ribs -->
  <rect x="52" y="18" width="124" height="18" rx="3" fill="#060b18" stroke="#0891b2" stroke-width="1" />
  <g stroke="#22d3ee" stroke-width="1.8" stroke-linecap="round">
    <line x1="60" y1="22" x2="168" y2="22" />
    <line x1="60" y1="27" x2="168" y2="27" />
    <line x1="60" y1="32" x2="168" y2="32" />
  </g>

  <!-- Side Grip Grooves -->
  <g fill="#050814" stroke="#0891b2" stroke-width="0.8">
    <rect x="33" y="52" width="7" height="5" rx="1" />
    <rect x="33" y="62" width="7" height="5" rx="1" />
    <rect x="33" y="72" width="7" height="5" rx="1" />
    <rect x="33" y="82" width="7" height="5" rx="1" />
    <rect x="180" y="52" width="7" height="5" rx="1" />
    <rect x="180" y="62" width="7" height="5" rx="1" />
    <rect x="180" y="72" width="7" height="5" rx="1" />
    <rect x="180" y="82" width="7" height="5" rx="1" />
  </g>

  <!-- Security Screws -->
  <g fill="#475569" stroke="#cbd5e1" stroke-width="1">
    <circle cx="43" cy="166" r="4.5" />
    <line x1="40.5" y1="166" x2="45.5" y2="166" stroke="#0f172a" stroke-width="1.4" />
    <circle cx="177" cy="166" r="4.5" />
    <line x1="174.5" y1="166" x2="179.5" y2="166" stroke="#0f172a" stroke-width="1.4" />
  </g>

  <!-- Recessed Center Label Well -->
  <rect x="46" y="42" width="128" height="114" rx="6" fill="#03050c" stroke="#0891b2" stroke-width="1.5" />

  <!-- Glossy Cartridge Label Sticker -->
  <rect x="49" y="45" width="122" height="108" rx="4" fill="url(#rr-label)" stroke="#22d3ee" stroke-width="1.3" />

  <!-- Top Sticker Header Band -->
  <path d="M 50 49 A 3 3 0 0 1 53 46 H 167 A 3 3 0 0 1 170 49 V 61 H 50 Z" fill="#06b6d4" />
  <text x="110" y="56.5" text-anchor="middle" fill="#050814" font-family="monospace" font-weight="900" font-size="9.2" letter-spacing="1.6">REDOX ROGUE</text>

  <!-- Left Half-Cell Card (Reduction: MnO4- Purple) -->
  <g transform="translate(55, 68) rotate(-6)">
    <rect x="0" y="0" width="38" height="52" rx="4" fill="#1e0b36" stroke="#c084fc" stroke-width="1.6" />
    <rect x="4" y="4" width="30" height="18" rx="2" fill="#3b0764" />
    <text x="19" y="16" text-anchor="middle" fill="#e9d5ff" font-family="monospace" font-weight="900" font-size="8.5">MnO₄⁻</text>
    <text x="19" y="34" text-anchor="middle" fill="#34d399" font-family="monospace" font-weight="bold" font-size="7.5">+1.51V</text>
    <text x="19" y="45" text-anchor="middle" fill="#a855f7" font-family="monospace" font-weight="bold" font-size="6.5">OXIDANT</text>
  </g>

  <!-- Right Half-Cell Card (Oxidation: Zn / Fe2+ Emerald-Cyan) -->
  <g transform="translate(126, 65) rotate(6)">
    <rect x="0" y="0" width="38" height="52" rx="4" fill="#08242e" stroke="#22d3ee" stroke-width="1.6" />
    <rect x="4" y="4" width="30" height="18" rx="2" fill="#0f3b4a" />
    <text x="19" y="16" text-anchor="middle" fill="#cffafe" font-family="monospace" font-weight="900" font-size="9">Zn²⁺</text>
    <text x="19" y="34" text-anchor="middle" fill="#facc15" font-family="monospace" font-weight="bold" font-size="7.5">-0.76V</text>
    <text x="19" y="45" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-weight="bold" font-size="6.5">REDUCT</text>
  </g>

  <!-- Center High-Voltage Electron Transfer Bolt -->
  <g transform="translate(110, 96)">
    <circle cx="0" cy="0" r="16" fill="#050814" stroke="#a855f7" stroke-width="1.4" opacity="0.9" />
    <path d="M 3 -14 L -8 2 H 0 L -3 14 L 9 -2 H 1 Z" fill="url(#rr-bolt)" stroke="#ffffff" stroke-width="0.9" stroke-linejoin="round" filter="url(#rr-glow)" />
    <!-- Orbiting e- sparks -->
    <circle cx="-18" cy="-14" r="2.2" fill="#22d3ee" filter="url(#rr-glow)" />
    <circle cx="19" cy="12" r="2.2" fill="#c084fc" filter="url(#rr-glow)" />
  </g>

  <!-- Bottom ROM Serial Badge on Sticker -->
  <rect x="55" y="136" width="110" height="12" rx="2" fill="#050814" stroke="#a855f7" stroke-width="1" />
  <text x="110" y="144.5" text-anchor="middle" fill="#22d3ee" font-family="monospace" font-weight="bold" font-size="7" letter-spacing="0.8">ALX-05 • ELECTRO-DECK</text>

  <!-- Molded Downward Insertion Triangle on Cartridge Shell -->
  <polygon points="103,163 117,163 110,172" fill="#0891b2" stroke="#22d3ee" stroke-width="1" />
</svg>
