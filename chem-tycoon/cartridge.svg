<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" width="220" height="220">
  <defs>
    <!-- Industrial Steel & Hazard Amber Cartridge Shell -->
    <linearGradient id="ct-shell" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="55%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="ct-shell-edge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
    <!-- Sticker Label Gradient -->
    <linearGradient id="ct-label" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1322" />
      <stop offset="60%" stop-color="#1c1917" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>
    <!-- Gold PCB Pins Gradient -->
    <linearGradient id="ct-gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#a16207" />
    </linearGradient>
    <!-- Hazard Stripe Pattern -->
    <pattern id="ct-hazard" width="12" height="12" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <rect width="6" height="12" fill="#f59e0b" />
      <rect x="6" width="6" height="12" fill="#1e293b" />
    </pattern>
    <filter id="ct-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Ambient Drop Shadow -->
  <rect x="28" y="14" width="164" height="174" rx="10" fill="#020617" opacity="0.75" />

  <!-- Bottom PCB Connector Housing -->
  <rect x="44" y="176" width="132" height="28" rx="4" fill="#0f172a" stroke="#f59e0b" stroke-width="2" />
  <rect x="50" y="180" width="120" height="22" rx="2" fill="#062e1e" stroke="#10b981" stroke-width="1" />

  <!-- Gold Edge Connector Pins -->
  <g fill="url(#ct-gold)">
    <rect x="55" y="182" width="6" height="19" rx="1" />
    <rect x="65" y="182" width="6" height="19" rx="1" />
    <rect x="75" y="182" width="6" height="19" rx="1" />
    <rect x="85" y="182" width="6" height="19" rx="1" />
    <rect x="95" y="182" width="6" height="19" rx="1" />
    <rect x="105" y="182" width="6" height="19" rx="1" />
    <rect x="115" y="182" width="6" height="19" rx="1" />
    <rect x="125" y="182" width="6" height="19" rx="1" />
    <rect x="135" y="182" width="6" height="19" rx="1" />
    <rect x="145" y="182" width="6" height="19" rx="1" />
    <rect x="155" y="182" width="6" height="19" rx="1" />
    <rect x="163" y="182" width="4" height="19" rx="1" />
  </g>

  <!-- Main Cartridge Body with Left Notch -->
  <path d="M 38 14
           H 180
           A 8 8 0 0 1 188 22
           V 174
           A 6 6 0 0 1 182 180
           H 38
           A 6 6 0 0 1 32 174
           V 32
           L 44 20
           V 14 Z"
        fill="url(#ct-shell)"
        stroke="url(#ct-shell-edge)"
        stroke-width="2.5" />

  <!-- Top Grip Spine with Caution Stripes -->
  <rect x="52" y="18" width="124" height="18" rx="3" fill="url(#ct-hazard)" stroke="#f59e0b" stroke-width="1.2" />

  <!-- Side Grip Grooves -->
  <g fill="#0f172a" stroke="#64748b" stroke-width="0.8">
    <rect x="33" y="52" width="7" height="5" rx="1" />
    <rect x="33" y="62" width="7" height="5" rx="1" />
    <rect x="33" y="72" width="7" height="5" rx="1" />
    <rect x="33" y="82" width="7" height="5" rx="1" />
    <rect x="180" y="52" width="7" height="5" rx="1" />
    <rect x="180" y="62" width="7" height="5" rx="1" />
    <rect x="180" y="72" width="7" height="5" rx="1" />
    <rect x="180" y="82" width="7" height="5" rx="1" />
  </g>

  <!-- Industrial Hex Bolts on Shell Corners -->
  <g fill="#64748b" stroke="#cbd5e1" stroke-width="1">
    <circle cx="43" cy="166" r="4.5" />
    <circle cx="43" cy="166" r="1.8" fill="#1e293b" />
    <circle cx="177" cy="166" r="4.5" />
    <circle cx="177" cy="166" r="1.8" fill="#1e293b" />
  </g>

  <!-- Recessed Center Label Well -->
  <rect x="46" y="42" width="128" height="114" rx="6" fill="#090d16" stroke="#475569" stroke-width="1.5" />

  <!-- Glossy Cartridge Label Sticker -->
  <rect x="49" y="45" width="122" height="108" rx="4" fill="url(#ct-label)" stroke="#f59e0b" stroke-width="1.4" />

  <!-- Top Sticker Header Band -->
  <path d="M 50 49 A 3 3 0 0 1 53 46 H 167 A 3 3 0 0 1 170 49 V 61 H 50 Z" fill="#f59e0b" />
  <text x="110" y="56.5" text-anchor="middle" fill="#090d16" font-family="monospace" font-weight="900" font-size="9" letter-spacing="1.5">CHEM-TYCOON</text>

  <!-- Chemical Plant Distillation Towers & Reactor Pipes -->
  <g transform="translate(56, 66)">
    <!-- Left Fractional Distillation Column -->
    <rect x="8" y="8" width="22" height="56" rx="4" fill="#334155" stroke="#94a3b8" stroke-width="1.5" />
    <!-- Column Trays / Sight Glasses -->
    <rect x="12" y="15" width="14" height="5" rx="1" fill="#38bdf8" filter="url(#ct-glow)" />
    <rect x="12" y="26" width="14" height="5" rx="1" fill="#34d399" filter="url(#ct-glow)" />
    <rect x="12" y="37" width="14" height="5" rx="1" fill="#facc15" />
    <rect x="12" y="48" width="14" height="5" rx="1" fill="#f97316" />

    <!-- Overhead Condenser Pipe -->
    <path d="M 19 8 V 2 H 58 V 18" fill="none" stroke="#f59e0b" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Recycle Gas Loop -->
    <path d="M 30 34 H 46" fill="none" stroke="#38bdf8" stroke-width="3" />

    <!-- Center Catalytic Reactor Vessel -->
    <rect x="44" y="18" width="30" height="46" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <!-- Glowing Green Catalyst Bed -->
    <rect x="49" y="34" width="20" height="22" rx="3" fill="#052e16" stroke="#22c55e" stroke-width="1.2" />
    <circle cx="55" cy="46" r="2.2" fill="#4ade80" />
    <circle cx="63" cy="42" r="2" fill="#4ade80" />
    <circle cx="59" cy="51" r="1.8" fill="#86efac" />

    <!-- Pressure Gauge Dial (Right) -->
    <circle cx="92" cy="26" r="14" fill="#0f172a" stroke="#fbbf24" stroke-width="2" />
    <path d="M 83 31 A 10 10 0 1 1 101 31" fill="none" stroke="#22c55e" stroke-width="2" />
    <path d="M 96 17 A 10 10 0 0 1 101 31" fill="none" stroke="#ef4444" stroke-width="2" />
    <line x1="92" y1="26" x2="99" y2="19" stroke="#ef4444" stroke-width="2" stroke-linecap="round" />
    <circle cx="92" cy="26" r="2.2" fill="#f8fafc" />

    <!-- Red Valve Wheel -->
    <circle cx="38" cy="34" r="5.5" fill="none" stroke="#ef4444" stroke-width="2" />
    <line x1="33" y1="34" x2="43" y2="34" stroke="#ef4444" stroke-width="1.5" />
    <line x1="38" y1="29" x2="38" y2="39" stroke="#ef4444" stroke-width="1.5" />

    <!-- Profit / Yield Ticker Badge -->
    <rect x="78" y="45" width="28" height="17" rx="3" fill="#052e16" stroke="#4ade80" stroke-width="1.2" />
    <text x="92" y="56.5" text-anchor="middle" fill="#4ade80" font-family="monospace" font-weight="900" font-size="9.5">99%</text>
  </g>

  <!-- Bottom ROM Serial Badge on Sticker -->
  <rect x="55" y="136" width="110" height="12" rx="2" fill="#090d16" stroke="#f59e0b" stroke-width="1" />
  <text x="110" y="144.5" text-anchor="middle" fill="#fbbf24" font-family="monospace" font-weight="bold" font-size="7" letter-spacing="0.8">ALX-02 • SIM-ROM 11X</text>

  <!-- Molded Downward Insertion Triangle on Cartridge Shell -->
  <polygon points="103,163 117,163 110,172" fill="#f59e0b" stroke="#fef08a" stroke-width="0.8" />
</svg>
