<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>ChemTycoon</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;

	/* Floating Fullscreen / Exit Button */
#fs-btn {
    position: fixed;
    top: 12px;
    right: 12px;
    z-index: 999;
    background: rgba(11, 22, 38, 0.85);
    border: 1px solid #22d3c5;
    color: #22d3c5;
    font-size: 0.75rem;
    font-family: monospace;
    font-weight: 700;
    padding: 6px 12px;
    border-radius: 4px;
    cursor: pointer;
    backdrop-filter: blur(4px);
    transition: all 0.2s ease;
}

#fs-btn:hover {
    background: #22d3c5;
    color: #0b1626;
    box-shadow: 0 0 10px #22d3c5;
}

/* First-click Fullscreen Splash Overlay */
#click-to-fullscreen-overlay {
    position: fixed;
    top: 0; left: 0; width: 100vw; height: 100vh;
    background: rgba(7, 13, 24, 0.92);
    z-index: 1000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: #22d3c5;
    font-family: monospace;
    text-align: center;
    backdrop-filter: blur(6px);
}

#click-to-fullscreen-overlay h2 {
    font-size: 1.5rem;
    letter-spacing: 2px;
    margin-bottom: 0.5rem;
    color: #fff;
    text-shadow: 0 0 10px #22d3c5;
}

#click-to-fullscreen-overlay p {
    font-size: 0.95rem;
    color: #94a3b8;
    margin-bottom: 1.5rem;
}

.tap-prompt {
    font-size: 0.85rem;
    padding: 8px 16px;
    border: 2px solid #22d3c5;
    border-radius: 4px;
    background: rgba(34, 211, 197, 0.15);
    animation: pulse-glow 1.5s infinite;
}

@keyframes pulse-glow {
    0%, 100% { box-shadow: 0 0 5px rgba(34, 211, 197, 0.4); }
    50% { box-shadow: 0 0 18px rgba(34, 211, 197, 0.9); }
}
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"><meta name="apple-mobile-web-app-capable" content="yes">
	</head>
	<body>
		<button id="fs-btn" onclick="toggleFullScreen()" title="Toggle Fullscreen">⛶ FULLSCREEN</button>

<div id="click-to-fullscreen-overlay" onclick="startFullscreenGame()">
  <h2>CHEMTYCOON</h2>
  <p>Industrial Plant Simulation</p>
  <div class="tap-prompt">[ CLICK OR TAP TO START FULLSCREEN ]</div>
</div>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="index.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":true,"fileSizes":{"index.pck":3505896,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
		<script>
			function enterFullscreen() {
				const el = document.documentElement;
				if (el.requestFullscreen) {
					return el.requestFullscreen().catch(() => {});
				} else if (el.webkitRequestFullscreen) {
					return el.webkitRequestFullscreen();
				}
			}
			
			function exitFullscreen() {
				if (document.exitFullscreen) {
					return document.exitFullscreen().catch(() => {});
				} else if (document.webkitExitFullscreen) {
					return document.webkitExitFullscreen();
				}
			}
			
			function toggleFullScreen() {
				if (!document.fullscreenElement && !document.webkitFullscreenElement) {
					enterFullscreen();
				} else {
					exitFullscreen();
				}
			}
			
			function startFullscreenGame() {
				// Only attempt fullscreen on devices >= 768px (desktops and tablets)
				if (window.innerWidth >= 768) {
					enterFullscreen();
				}
				const overlay = document.getElementById('click-to-fullscreen-overlay');
				if (overlay) {
					overlay.style.display = 'none';
				}
				// Return focus to the Godot Canvas
				const canvas = document.getElementById('canvas');
				if (canvas) {
					canvas.focus();
				}
			}
			
			// Update button label based on actual fullscreen state
			document.addEventListener('fullscreenchange', () => {
				const btn = document.getElementById('fs-btn');
				if (btn) {
					btn.textContent = document.fullscreenElement ? '✕ EXIT FULLSCREEN' : '⛶ FULLSCREEN';
				}
			});
			</script>
	</body>
</html>
