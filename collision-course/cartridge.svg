<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" width="220" height="220">
  <defs>
    <!-- Deep lab-navy shell with cyan/emerald edge highlights -->
    <linearGradient id="cc-shell" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f223d" />
      <stop offset="55%" stop-color="#081326" />
      <stop offset="100%" stop-color="#040912" />
    </linearGradient>
    <linearGradient id="cc-shell-edge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="cc-label" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050b16" />
      <stop offset="55%" stop-color="#0a1930" />
      <stop offset="100%" stop-color="#121428" />
    </linearGradient>
    <linearGradient id="cc-gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#a16207" />
    </linearGradient>
    <linearGradient id="cc-tail" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.72" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.16" />
    </linearGradient>
    <filter id="cc-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Ambient Drop Shadow -->
  <rect x="28" y="14" width="164" height="174" rx="10" fill="#020408" opacity="0.82" />

  <!-- Bottom PCB Connector Housing -->
  <rect x="44" y="176" width="132" height="28" rx="4" fill="#071121" stroke="#38bdf8" stroke-width="2" />
  <rect x="50" y="180" width="120" height="22" rx="2" fill="#072236" stroke="#10b981" stroke-width="1" />

  <!-- Gold Edge Connector Pins -->
  <g fill="url(#cc-gold)">
    <rect x="55" y="182" width="6" height="19" rx="1" />
    <rect x="65" y="182" width="6" height="19" rx="1" />
    <rect x="75" y="182" width="6" height="19" rx="1" />
    <rect x="85" y="182" width="6" height="19" rx="1" />
    <rect x="95" y="182" width="6" height="19" rx="1" />
    <rect x="105" y="182" width="6" height="19" rx="1" />
    <rect x="115" y="182" width="6" height="19" rx="1" />
    <rect x="125" y="182" width="6" height="19" rx="1" />
    <rect x="135" y="182" width="6" height="19" rx="1" />
    <rect x="145" y="182" width="6" height="19" rx="1" />
    <rect x="155" y="182" width="6" height="19" rx="1" />
    <rect x="163" y="182" width="4" height="19" rx="1" />
  </g>

  <!-- Main Cartridge Body with Left Notch -->
  <path d="M 38 14 H 180 A 8 8 0 0 1 188 22 V 174 A 6 6 0 0 1 182 180 H 38 A 6 6 0 0 1 32 174 V 32 L 44 20 V 14 Z"
        fill="url(#cc-shell)" stroke="url(#cc-shell-edge)" stroke-width="2.5" />

  <!-- Top Grip Spine Ribs -->
  <rect x="52" y="18" width="124" height="18" rx="3" fill="#060f1e" stroke="#0369a1" stroke-width="1" />
  <g stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round">
    <line x1="60" y1="22" x2="168" y2="22" />
    <line x1="60" y1="27" x2="168" y2="27" />
    <line x1="60" y1="32" x2="168" y2="32" />
  </g>

  <!-- Side Grip Grooves -->
  <g fill="#050b16" stroke="#0369a1" stroke-width="0.8">
    <rect x="33" y="52" width="7" height="5" rx="1" />
    <rect x="33" y="62" width="7" height="5" rx="1" />
    <rect x="33" y="72" width="7" height="5" rx="1" />
    <rect x="33" y="82" width="7" height="5" rx="1" />
    <rect x="180" y="52" width="7" height="5" rx="1" />
    <rect x="180" y="62" width="7" height="5" rx="1" />
    <rect x="180" y="72" width="7" height="5" rx="1" />
    <rect x="180" y="82" width="7" height="5" rx="1" />
  </g>

  <!-- Security Screws -->
  <g fill="#475569" stroke="#cbd5e1" stroke-width="1">
    <circle cx="43" cy="166" r="4.5" />
    <line x1="40.5" y1="166" x2="45.5" y2="166" stroke="#0f172a" stroke-width="1.4" />
    <circle cx="177" cy="166" r="4.5" />
    <line x1="174.5" y1="166" x2="179.5" y2="166" stroke="#0f172a" stroke-width="1.4" />
  </g>

  <!-- Recessed Center Label Well + Sticker -->
  <rect x="46" y="42" width="128" height="114" rx="6" fill="#030710" stroke="#38bdf8" stroke-width="1.5" />
  <rect x="49" y="45" width="122" height="108" rx="4" fill="url(#cc-label)" stroke="#10b981" stroke-width="1.3" />

  <!-- Top Sticker Header Band -->
  <path d="M 50 49 A 3 3 0 0 1 53 46 H 167 A 3 3 0 0 1 170 49 V 61 H 50 Z" fill="#38bdf8" />
  <text x="110" y="56.5" text-anchor="middle" fill="#050d1a" font-family="monospace" font-weight="900" font-size="8.6" letter-spacing="1.1">COLLISION COURSE</text>

  <!-- Corner Arcade Chemistry Badges -->
  <g transform="translate(53, 65)">
    <rect x="0" y="0" width="32" height="14" rx="3" fill="#062925" stroke="#34d399" stroke-width="1" />
    <text x="16" y="9.8" text-anchor="middle" fill="#6ee7b7" font-family="monospace" font-weight="900" font-size="6.8">E≥Ea</text>
  </g>
  <g transform="translate(135, 65)">
    <rect x="0" y="0" width="32" height="14" rx="3" fill="#27142b" stroke="#c084fc" stroke-width="1" />
    <text x="16" y="9.8" text-anchor="middle" fill="#e9d5ff" font-family="monospace" font-weight="900" font-size="7">T(K)</text>
  </g>

  <!-- Maxwell-Boltzmann Curve Backdrop inside Sticker -->
  <g transform="translate(0, 2)">
    <!-- Shaded active tail E >= Ea -->
    <path d="M 122 103 C 134 111, 146 123, 164 128 L 164 132 L 122 132 Z" fill="url(#cc-tail)" />
    <!-- Axes -->
    <polyline points="56,88 56,132 164,132" fill="none" stroke="#475569" stroke-width="1.2" />
    <!-- Ghost warmer curve -->
    <path d="M 56 132 C 74 106, 98 104, 124 114 C 142 121, 154 127, 164 130"
          fill="none" stroke="#94a3b8" stroke-width="1.1" stroke-dasharray="2.5 2.5" opacity="0.55" />
    <!-- Primary Maxwell-Boltzmann curve -->
    <path d="M 56 132 C 66 84, 84 82, 102 94 C 118 104, 138 122, 164 130"
          fill="none" stroke="#38bdf8" stroke-width="2.1" filter="url(#cc-glow)" />
    <!-- Activation energy coral line -->
    <line x1="122" y1="86" x2="122" y2="132" stroke="#fb7185" stroke-width="1.6" stroke-dasharray="3 2" />
  </g>

  <!-- Colliding Reactant Projectile + Trajectory Dots -->
  <g filter="url(#cc-glow)">
    <circle cx="67" cy="95" r="1.8" fill="#6ee7b7" opacity="0.45" />
    <circle cx="76" cy="98" r="2.1" fill="#6ee7b7" opacity="0.68" />
    <circle cx="85" cy="101" r="2.5" fill="#34d399" opacity="0.92" />
    <!-- Diatomic projectile -->
    <circle cx="94" cy="103" r="6" fill="#0a2e38" stroke="#34d399" stroke-width="1.6" />
    <line x1="91.5" y1="103" x2="96.5" y2="103" stroke="#e0f2fe" stroke-width="2" />
    <circle cx="91.5" cy="103" r="2.5" fill="#38bdf8" />
    <circle cx="96.5" cy="103" r="2.5" fill="#38bdf8" />
  </g>

  <!-- Substrate Target with Green Active Site & Purple Steric Shield -->
  <g transform="translate(136, 106)">
    <!-- Purple inert steric shield (right side) -->
    <path d="M 0 -13 A 13 13 0 0 1 0 13" fill="none" stroke="#a855f7" stroke-width="3.6" stroke-linecap="round" />
    <circle cx="14.5" cy="0" r="2.6" fill="#7e22ce" stroke="#d8b4fe" stroke-width="0.9" />
    <!-- Emerald active site (left side facing projectile) -->
    <path d="M 0 -13 A 13 13 0 0 0 0 13" fill="none" stroke="#34d399" stroke-width="3.8" stroke-linecap="round" filter="url(#cc-glow)" />
    <!-- Core substrate disc -->
    <circle cx="0" cy="0" r="8.5" fill="#0d1b2e" stroke="#38bdf8" stroke-width="1" />
    <text x="0" y="2.6" text-anchor="middle" fill="#f8fafc" font-family="monospace" font-weight="900" font-size="7.5">I₂</text>
  </g>

  <!-- Impact spark burst at active site contact -->
  <g stroke="#fde047" stroke-width="1.5" stroke-linecap="round" filter="url(#cc-glow)">
    <line x1="114" y1="95" x2="110" y2="91" />
    <line x1="115" y1="113" x2="111" y2="117" />
    <line x1="118" y1="104" x2="112" y2="104" />
  </g>

  <!-- Bottom ROM Serial Badge on Sticker -->
  <rect x="55" y="144" width="110" height="7" rx="2" fill="#040b0e" stroke="#38bdf8" stroke-width="0.8" />
  <text x="110" y="149.6" text-anchor="middle" fill="#67e8f9" font-family="monospace" font-weight="bold" font-size="5.6" letter-spacing="0.7">ALX-11 • KINETIC ENGINE</text>

  <!-- Molded Downward Insertion Triangle -->
  <polygon points="103,163 117,163 110,172" fill="#0369a1" stroke="#38bdf8" stroke-width="1" />
</svg>
