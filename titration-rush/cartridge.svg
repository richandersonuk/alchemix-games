<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" width="220" height="220">
  <defs>
    <!-- Lab-night shell with phenolphthalein-pink / burette-cyan edge -->
    <linearGradient id="tr-shell" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b2540" />
      <stop offset="55%" stop-color="#0e1424" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>
    <linearGradient id="tr-shell-edge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4cc9f0" />
      <stop offset="50%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#0e7490" />
    </linearGradient>
    <linearGradient id="tr-label" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a12" />
      <stop offset="55%" stop-color="#151d33" />
      <stop offset="100%" stop-color="#2d0f24" />
    </linearGradient>
    <linearGradient id="tr-gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#a16207" />
    </linearGradient>
    <linearGradient id="tr-liquid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbcfe8" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="tr-glass" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cffafe" stop-opacity="0.15" />
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#cffafe" stop-opacity="0.12" />
    </linearGradient>
    <filter id="tr-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Ambient Drop Shadow -->
  <rect x="28" y="14" width="164" height="174" rx="10" fill="#020408" opacity="0.8" />

  <!-- Bottom PCB Connector Housing -->
  <rect x="44" y="176" width="132" height="28" rx="4" fill="#090e1a" stroke="#4cc9f0" stroke-width="2" />
  <rect x="50" y="180" width="120" height="22" rx="2" fill="#062e1e" stroke="#f472b6" stroke-width="1" />

  <!-- Gold Edge Connector Pins -->
  <g fill="url(#tr-gold)">
    <rect x="55" y="182" width="6" height="19" rx="1" />
    <rect x="65" y="182" width="6" height="19" rx="1" />
    <rect x="75" y="182" width="6" height="19" rx="1" />
    <rect x="85" y="182" width="6" height="19" rx="1" />
    <rect x="95" y="182" width="6" height="19" rx="1" />
    <rect x="105" y="182" width="6" height="19" rx="1" />
    <rect x="115" y="182" width="6" height="19" rx="1" />
    <rect x="125" y="182" width="6" height="19" rx="1" />
    <rect x="135" y="182" width="6" height="19" rx="1" />
    <rect x="145" y="182" width="6" height="19" rx="1" />
    <rect x="155" y="182" width="6" height="19" rx="1" />
    <rect x="163" y="182" width="4" height="19" rx="1" />
  </g>

  <!-- Main Cartridge Body with Left Notch -->
  <path d="M 38 14 H 180 A 8 8 0 0 1 188 22 V 174 A 6 6 0 0 1 182 180 H 38 A 6 6 0 0 1 32 174 V 32 L 44 20 V 14 Z"
        fill="url(#tr-shell)" stroke="url(#tr-shell-edge)" stroke-width="2.5" />

  <!-- Top Grip Spine Ribs -->
  <rect x="52" y="18" width="124" height="18" rx="3" fill="#080c17" stroke="#0891b2" stroke-width="1" />
  <g stroke="#4cc9f0" stroke-width="1.8" stroke-linecap="round">
    <line x1="60" y1="22" x2="168" y2="22" />
    <line x1="60" y1="27" x2="168" y2="27" />
    <line x1="60" y1="32" x2="168" y2="32" />
  </g>

  <!-- Side Grip Grooves -->
  <g fill="#060911" stroke="#0891b2" stroke-width="0.8">
    <rect x="33" y="52" width="7" height="5" rx="1" />
    <rect x="33" y="62" width="7" height="5" rx="1" />
    <rect x="33" y="72" width="7" height="5" rx="1" />
    <rect x="33" y="82" width="7" height="5" rx="1" />
    <rect x="180" y="52" width="7" height="5" rx="1" />
    <rect x="180" y="62" width="7" height="5" rx="1" />
    <rect x="180" y="72" width="7" height="5" rx="1" />
    <rect x="180" y="82" width="7" height="5" rx="1" />
  </g>

  <!-- Security Screws -->
  <g fill="#475569" stroke="#cbd5e1" stroke-width="1">
    <circle cx="43" cy="166" r="4.5" />
    <line x1="40.5" y1="166" x2="45.5" y2="166" stroke="#0f172a" stroke-width="1.4" />
    <circle cx="177" cy="166" r="4.5" />
    <line x1="174.5" y1="166" x2="179.5" y2="166" stroke="#0f172a" stroke-width="1.4" />
  </g>

  <!-- Recessed Center Label Well + Sticker -->
  <rect x="46" y="42" width="128" height="114" rx="6" fill="#04060c" stroke="#4cc9f0" stroke-width="1.5" />
  <rect x="49" y="45" width="122" height="108" rx="4" fill="url(#tr-label)" stroke="#f472b6" stroke-width="1.2" />

  <!-- Top Sticker Header Band -->
  <path d="M 50 49 A 3 3 0 0 1 53 46 H 167 A 3 3 0 0 1 170 49 V 61 H 50 Z" fill="#f472b6" />
  <text x="110" y="56.5" text-anchor="middle" fill="#ffffff" font-family="monospace" font-weight="900" font-size="8.2" letter-spacing="1.1">TITRATION RUSH</text>

  <!-- Burette with graduations, stopcock and a falling drop -->
  <g transform="translate(110, 0)">
    <rect x="-3.5" y="63" width="7" height="34" rx="1.5" fill="url(#tr-glass)" stroke="#a5f3fc" stroke-width="0.9" />
    <rect x="-2.2" y="70" width="4.4" height="27" fill="#bae6fd" opacity="0.55" />
    <g stroke="#e0f2fe" stroke-width="0.7">
      <line x1="-3.5" y1="68" x2="0" y2="68" />
      <line x1="-3.5" y1="74" x2="-0.5" y2="74" />
      <line x1="-3.5" y1="80" x2="0" y2="80" />
      <line x1="-3.5" y1="86" x2="-0.5" y2="86" />
      <line x1="-3.5" y1="92" x2="0" y2="92" />
    </g>
    <rect x="-4.5" y="97" width="9" height="4" rx="1" fill="#f1f5f9" />
    <rect x="-9" y="98" width="18" height="2" rx="1" fill="#2f80ed" />
    <path d="M -1.6 101 L 1.6 101 L 0.5 106 L -0.5 106 Z" fill="url(#tr-glass)" stroke="#a5f3fc" stroke-width="0.6" />
    <path d="M 0 108 C 1.8 110.5 1.8 112.5 0 113 C -1.8 112.5 -1.8 110.5 0 108 Z" fill="#f9a8d4" filter="url(#tr-glow)" />
  </g>

  <!-- White tile + conical flask with pale-pink endpoint liquid -->
  <rect x="84" y="139" width="52" height="4" rx="1" fill="#f8fafc" />
  <path d="M 104.5 114 V 121 L 90 138 A 1.5 1.5 0 0 0 91.2 139.5 H 128.8 A 1.5 1.5 0 0 0 130 138 L 115.5 121 V 114 Z"
        fill="url(#tr-glass)" stroke="#a5f3fc" stroke-width="1" />
  <path d="M 98.2 129 H 121.8 L 128.4 137.4 A 1 1 0 0 1 127.6 138.6 H 92.4 A 1 1 0 0 1 91.6 137.4 Z"
        fill="url(#tr-liquid)" filter="url(#tr-glow)" />
  <rect x="103.5" y="112.5" width="13" height="2.5" rx="1" fill="#a5f3fc" />

  <!-- Badges: concordance window and indicator -->
  <g transform="translate(54, 67)">
    <rect x="0" y="0" width="30" height="14" rx="3" fill="#2d0f24" stroke="#f472b6" stroke-width="1" />
    <text x="15" y="9.5" text-anchor="middle" fill="#fbcfe8" font-family="monospace" font-weight="900" font-size="6.8">±0.10</text>
  </g>
  <g transform="translate(136, 67)">
    <rect x="0" y="0" width="30" height="14" rx="3" fill="#062230" stroke="#4cc9f0" stroke-width="1" />
    <text x="15" y="9.5" text-anchor="middle" fill="#67e8f9" font-family="monospace" font-weight="900" font-size="6.8">cm³</text>
  </g>
  <g transform="translate(136, 112)">
    <rect x="0" y="0" width="30" height="14" rx="3" fill="#291804" stroke="#f59e0b" stroke-width="1" />
    <text x="15" y="9.5" text-anchor="middle" fill="#fde047" font-family="monospace" font-weight="900" font-size="6.8">pH</text>
  </g>

  <!-- Bottom ROM Serial Badge on Sticker -->
  <rect x="55" y="144" width="110" height="7" rx="2" fill="#070a12" stroke="#4cc9f0" stroke-width="0.8" />
  <text x="110" y="149.6" text-anchor="middle" fill="#fde047" font-family="monospace" font-weight="bold" font-size="5.6" letter-spacing="0.8">ALX-08 • CONCORDANT</text>

  <!-- Molded Downward Insertion Triangle -->
  <polygon points="103,163 117,163 110,172" fill="#0891b2" stroke="#4cc9f0" stroke-width="1" />
</svg>
