<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" width="220" height="220">
  <defs>
    <!-- Cartridge Shell Gradient (Translucent Atomic Purple / Indigo) -->
    <linearGradient id="ss-shell" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b1d70" />
      <stop offset="50%" stop-color="#27124f" />
      <stop offset="100%" stop-color="#170a33" />
    </linearGradient>
    <linearGradient id="ss-shell-edge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#4c1d95" />
    </linearGradient>
    <!-- Sticker Label Synthwave Gradient -->
    <linearGradient id="ss-label" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0728" />
      <stop offset="45%" stop-color="#3b0764" />
      <stop offset="100%" stop-color="#831843" />
    </linearGradient>
    <!-- Gold PCB Pins Gradient -->
    <linearGradient id="ss-gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#a16207" />
    </linearGradient>
    <!-- Glowing Flask Liquid -->
    <linearGradient id="ss-acid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#16a34a" />
    </linearGradient>
    <!-- Neon Glow Filter -->
    <filter id="ss-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Ambient Drop Shadow / Backplate -->
  <rect x="28" y="14" width="164" height="174" rx="10" fill="#090414" opacity="0.7" />

  <!-- Bottom PCB Connector Housing -->
  <rect x="44" y="176" width="132" height="28" rx="4" fill="#130926" stroke="#7e22ce" stroke-width="2" />
  <rect x="50" y="180" width="120" height="22" rx="2" fill="#062e1e" stroke="#10b981" stroke-width="1" />

  <!-- Gold Edge Connector Pins -->
  <g fill="url(#ss-gold)">
    <rect x="55" y="182" width="6" height="19" rx="1" />
    <rect x="65" y="182" width="6" height="19" rx="1" />
    <rect x="75" y="182" width="6" height="19" rx="1" />
    <rect x="85" y="182" width="6" height="19" rx="1" />
    <rect x="95" y="182" width="6" height="19" rx="1" />
    <rect x="105" y="182" width="6" height="19" rx="1" />
    <rect x="115" y="182" width="6" height="19" rx="1" />
    <rect x="125" y="182" width="6" height="19" rx="1" />
    <rect x="135" y="182" width="6" height="19" rx="1" />
    <rect x="145" y="182" width="6" height="19" rx="1" />
    <rect x="155" y="182" width="6" height="19" rx="1" />
    <rect x="163" y="182" width="4" height="19" rx="1" />
  </g>

  <!-- Main Cartridge Body with Left Notch -->
  <path d="M 38 14
           H 180
           A 8 8 0 0 1 188 22
           V 174
           A 6 6 0 0 1 182 180
           H 38
           A 6 6 0 0 1 32 174
           V 32
           L 44 20
           V 14 Z"
        fill="url(#ss-shell)"
        stroke="url(#ss-shell-edge)"
        stroke-width="2.5" />

  <!-- Top Grip Spine Ribs -->
  <rect x="52" y="18" width="124" height="18" rx="3" fill="#1e0d3d" stroke="#581c87" stroke-width="1" />
  <g stroke="#7e22ce" stroke-width="1.8" stroke-linecap="round">
    <line x1="60" y1="22" x2="168" y2="22" />
    <line x1="60" y1="27" x2="168" y2="27" />
    <line x1="60" y1="32" x2="168" y2="32" />
  </g>

  <!-- Side Grip Grooves (Left & Right) -->
  <g fill="#15082e" stroke="#581c87" stroke-width="0.8">
    <rect x="33" y="52" width="7" height="5" rx="1" />
    <rect x="33" y="62" width="7" height="5" rx="1" />
    <rect x="33" y="72" width="7" height="5" rx="1" />
    <rect x="33" y="82" width="7" height="5" rx="1" />
    <rect x="180" y="52" width="7" height="5" rx="1" />
    <rect x="180" y="62" width="7" height="5" rx="1" />
    <rect x="180" y="72" width="7" height="5" rx="1" />
    <rect x="180" y="82" width="7" height="5" rx="1" />
  </g>

  <!-- Corner Security Screws -->
  <g fill="#475569" stroke="#94a3b8" stroke-width="1">
    <circle cx="43" cy="166" r="4.5" />
    <line x1="40.5" y1="166" x2="45.5" y2="166" stroke="#1e293b" stroke-width="1.4" />
    <circle cx="177" cy="166" r="4.5" />
    <line x1="174.5" y1="166" x2="179.5" y2="166" stroke="#1e293b" stroke-width="1.4" />
  </g>

  <!-- Recessed Center Label Well -->
  <rect x="46" y="42" width="128" height="114" rx="6" fill="#090314" stroke="#6b21a8" stroke-width="1.5" />

  <!-- Glossy Cartridge Label Sticker -->
  <rect x="49" y="45" width="122" height="108" rx="4" fill="url(#ss-label)" stroke="#f472b6" stroke-width="1.2" />

  <!-- Top Sticker Header Band -->
  <path d="M 50 49 A 3 3 0 0 1 53 46 H 167 A 3 3 0 0 1 170 49 V 61 H 50 Z" fill="#ec4899" />
  <text x="110" y="56.5" text-anchor="middle" fill="#ffffff" font-family="monospace" font-weight="900" font-size="8.5" letter-spacing="1.2">SCIENCE SAVIOUR</text>

  <!-- Synthwave Horizon Grid inside Label -->
  <g stroke="#a855f7" stroke-width="0.6" opacity="0.45">
    <line x1="50" y1="125" x2="170" y2="125" />
    <line x1="50" y1="133" x2="170" y2="133" />
    <line x1="50" y1="141" x2="170" y2="141" />
    <line x1="80" y1="125" x2="62" y2="152" />
    <line x1="110" y1="125" x2="110" y2="152" />
    <line x1="140" y1="125" x2="158" y2="152" />
  </g>

  <!-- Synthwave Sun Disc -->
  <circle cx="110" cy="102" r="26" fill="#f59e0b" opacity="0.22" />

  <!-- Bubbling Green Erlenmeyer Flask (Right of Center) -->
  <g transform="translate(120, 74)">
    <path d="M 10 2 H 20 V 12 L 31 34 A 3 3 0 0 1 28 38 H 2 A 3 3 0 0 1 -1 34 L 10 12 Z" fill="#052e16" stroke="#4ade80" stroke-width="1.8" />
    <path d="M 5 22 L 25 22 L 29 34 A 2 2 0 0 1 27 36 H 3 A 2 2 0 0 1 1 34 Z" fill="url(#ss-acid)" />
    <rect x="8" y="0" width="14" height="3" rx="1" fill="#86efac" />
    <circle cx="12" cy="29" r="2.2" fill="#bbf7d0" />
    <circle cx="19" cy="26" r="1.6" fill="#bbf7d0" />
    <circle cx="16" cy="16" r="2" fill="#4ade80" filter="url(#ss-glow)" />
    <circle cx="21" cy="9" r="1.5" fill="#86efac" />
  </g>

  <!-- Alchemix Wizard Hat (Top Left of Artwork) -->
  <g transform="translate(56, 66)">
    <ellipse cx="24" cy="24" rx="22" ry="5" fill="#4c1d95" stroke="#c084fc" stroke-width="1.5" />
    <path d="M 8 23 L 22 0 L 31 4 L 26 9 L 38 23 Z" fill="#6b21a8" stroke="#c084fc" stroke-width="1.5" />
    <!-- Gold Hat Band & Buckle -->
    <path d="M 10 19 Q 24 22 36 19 L 37 23 Q 24 26 9 23 Z" fill="#facc15" />
    <rect x="20" y="18" width="7" height="6" rx="1" fill="#fef08a" stroke="#ca8a04" stroke-width="1" />
  </g>

  <!-- Neon Magenta Flying-V Electric Guitar (Diagonal Hero Emblem) -->
  <g transform="translate(98, 102) rotate(-32)">
    <!-- Guitar Neck -->
    <rect x="-3" y="-32" width="6" height="30" fill="#fde047" stroke="#713f12" stroke-width="1" />
    <!-- Headstock -->
    <polygon points="-5,-32 5,-32 3,-41 -3,-41" fill="#ec4899" stroke="#fbcfe8" stroke-width="1" />
    <!-- Flying-V Body Wings -->
    <polygon points="0,-6 -18,22 -9,25 0,9 9,25 18,22" fill="#db2777" stroke="#fbcfe8" stroke-width="1.6" filter="url(#ss-glow)" />
    <!-- Pickups -->
    <rect x="-4" y="-1" width="8" height="3" rx="1" fill="#f8fafc" />
    <rect x="-4" y="4" width="8" height="3" rx="1" fill="#f8fafc" />
  </g>

  <!-- Cyan Lightning Bolts -->
  <polyline points="62,105 71,111 66,116 76,124" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" filter="url(#ss-glow)" />
  <polyline points="158,68 150,75 155,79 146,87" fill="none" stroke="#facc15" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Bottom ROM Serial Badge on Sticker -->
  <rect x="55" y="136" width="110" height="12" rx="2" fill="#090418" stroke="#a855f7" stroke-width="1" />
  <text x="110" y="144.5" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-weight="bold" font-size="7" letter-spacing="0.8">ALX-01 • 64 MEGABIT</text>

  <!-- Molded Downward Insertion Triangle on Cartridge Shell -->
  <polygon points="103,163 117,163 110,172" fill="#581c87" stroke="#a855f7" stroke-width="1" />
</svg>
