<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>The Alchemix: Science Saviour</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Outfit:wght@400;700;900&display=swap');
    
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: manipulation;
    }
    
    body {
      margin: 0;
      padding: 0;
      background-color: #030014;
      font-family: 'Outfit', sans-serif;
      overflow: hidden;
    }
    
    .font-retro {
      font-family: 'Press Start 2P', monospace;
    }

    canvas {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    .touch-btn {
      touch-action: none;
      user-select: none;
    }
  </style>
</head>
<body class="w-screen h-screen flex flex-col items-center justify-center bg-slate-950 text-white relative">

  <!-- HUD TOP BAR -->
  <header class="absolute top-0 left-0 right-0 z-20 flex items-center justify-between px-3 py-2 bg-slate-950/80 backdrop-blur-md border-b border-purple-500/30 text-xs">
    <a href="../" class="flex items-center gap-2 text-purple-400 hover:text-pink-400 transition-colors font-retro text-[10px]">
      <span>&larr;</span> <span>HUB</span>
    </a>
    
    <div class="flex items-center gap-3 sm:gap-6 font-retro text-[9px] sm:text-[11px]">
      <div>LVL: <span id="hud-level" class="text-amber-400">1</span>/5</div>
      <div>HP: <span id="hud-hp" class="text-emerald-400">100</span>%</div>
      <div>GENRE: <span id="hud-genre" class="text-pink-400">PHONK</span></div>
      <div>SCORE: <span id="hud-score" class="text-cyan-400">0</span></div>
    </div>

    <button id="btn-audio-toggle" class="px-2 py-1 bg-purple-900/60 border border-purple-500/40 rounded text-[10px] font-retro text-purple-300">
      🔊
    </button>
  </header>

  <!-- CANVAS GAME CONTAINER -->
  <div class="relative w-full h-full flex items-center justify-center pt-8 pb-16">
    <canvas id="gameCanvas" class="w-full h-full max-w-5xl max-h-[720px] shadow-2xl border border-purple-900/40 rounded-xl bg-slate-900"></canvas>
  </div>

  <!-- ON-SCREEN MOBILE CONTROLS -->
  <div class="absolute bottom-2 left-2 right-2 z-20 flex justify-between items-center pointer-events-none md:hidden">
    <!-- Directional Pad -->
    <div class="flex gap-2 pointer-events-auto">
      <button id="touch-left" class="touch-btn w-14 h-14 bg-slate-900/80 border border-purple-500/50 rounded-2xl flex items-center justify-center text-xl text-purple-300 active:bg-purple-600 active:text-white shadow-lg">
        ◀
      </button>
      <button id="touch-right" class="touch-btn w-14 h-14 bg-slate-900/80 border border-purple-500/50 rounded-2xl flex items-center justify-center text-xl text-purple-300 active:bg-purple-600 active:text-white shadow-lg">
        ▶
      </button>
    </div>

    <!-- Actions Pad -->
    <div class="flex gap-2 pointer-events-auto">
      <button id="touch-switch" class="touch-btn w-12 h-12 bg-pink-950/80 border border-pink-500/50 rounded-2xl flex items-center justify-center text-xs font-retro text-pink-300 active:bg-pink-600 active:text-white shadow-lg">
        GENRE
      </button>
      <button id="touch-shoot" class="touch-btn w-14 h-14 bg-cyan-950/80 border border-cyan-500/50 rounded-2xl flex items-center justify-center text-xl text-cyan-300 active:bg-cyan-600 active:text-white shadow-lg">
        ⚡
      </button>
      <button id="touch-jump" class="touch-btn w-14 h-14 bg-purple-950/80 border border-purple-500/50 rounded-2xl flex items-center justify-center text-xl text-purple-300 active:bg-purple-600 active:text-white shadow-lg">
        ▲
      </button>
    </div>
  </div>

  <!-- GAME SCRIPT WITH VERSION CACHE-BUSTING -->
  <script>
    // =========================================================================
    // VERSION CONTROL (Increment to bust GitHub Pages caching for assets)
    // =========================================================================
    const GAME_VERSION = '1.0.0';

    function getSoundUrl(filename) {
      return `./sounds/${filename}?v=${GAME_VERSION}`;
    }

    // Audio Asset Paths with Versioning[cite: 1]
    const AUDIO_TRACKS = {
      phonk: getSoundUrl('phonk.mp3'),
      rock: getSoundUrl('rock.mp3'),
      reggae: getSoundUrl('reggae.mp3'),
      viral: getSoundUrl('viral.mp3'),
      jump: getSoundUrl('jump.wav'),
      flask: getSoundUrl('flask.wav'),
      switch: getSoundUrl('switch.wav'),
      defeat_1: getSoundUrl('defeat_1.wav'),
      defeat_2: getSoundUrl('defeat_2.wav'),
      defeat_3: getSoundUrl('defeat_3.wav'),
      defeat_4: getSoundUrl('defeat_4.wav'),
      defeat_5: getSoundUrl('defeat_5.wav'),
      solo_1: getSoundUrl('solo_1.wav'),
      solo_2: getSoundUrl('solo_2.wav'),
      solo_3: getSoundUrl('solo_3.wav'),
      solo_4: getSoundUrl('solo_4.wav')
    };

    // Canvas & Context Setup
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = 960;
    canvas.height = 540;

    // HUD Elements
    const hudLevel = document.getElementById('hud-level');
    const hudHp = document.getElementById('hud-hp');
    const hudGenre = document.getElementById('hud-genre');
    const hudScore = document.getElementById('hud-score');
    const btnAudioToggle = document.getElementById('btn-audio-toggle');

    // Audio Engine
    let audioMuted = false;
    let currentBgm = null;
    const soundCache = {};

    function playSound(name, isLoop = false) {
      if (audioMuted) return null;
      try {
        const audio = new Audio(AUDIO_TRACKS[name]);
        audio.loop = isLoop;
        audio.play().catch(() => {});
        return audio;
      } catch (e) {
        return null;
      }
    }

    function switchBgm(genreName) {
      if (currentBgm) {
        currentBgm.pause();
        currentBgm.currentTime = 0;
      }
      currentBgm = playSound(genreName, true);
    }

    btnAudioToggle.addEventListener('click', () => {
      audioMuted = !audioMuted;
      btnAudioToggle.textContent = audioMuted ? '🔇' : '🔊';
      if (audioMuted && currentBgm) {
        currentBgm.pause();
      } else if (!audioMuted && currentBgm) {
        currentBgm.play().catch(() => {});
      }
    });

    // Game Genres & Modes
    const GENRES = [
      { name: 'PHONK', color: '#ec4899', bulletSpeed: 10, fireRate: 140 },
      { name: 'GUITAR', color: '#f59e0b', bulletSpeed: 14, fireRate: 200 },
      { name: 'REGGAE', color: '#10b981', bulletSpeed: 8, fireRate: 90 }
    ];
    let currentGenreIndex = 0;

    // Player State
    const player = {
      x: 80,
      y: 380,
      width: 32,
      height: 48,
      vx: 0,
      vy: 0,
      speed: 4.8,
      jumpStrength: -12.5,
      isGrounded: false,
      hp: 100,
      score: 0,
      lastShotTime: 0
    };

    // Entities
    let bullets = [];
    let flasks = [];
    let enemies = [];
    let level = 1;

    // Platforms
    const platforms = [
      { x: 0, y: 480, w: 960, h: 60 },
      { x: 220, y: 380, w: 160, h: 20 },
      { x: 440, y: 300, w: 160, h: 20 },
      { x: 660, y: 220, w: 180, h: 20 },
      { x: 340, y: 160, w: 140, h: 20 }
    ];

    // Spawn Pickups
    function initLevel() {
      flasks = [
        { x: 280, y: 340, collected: false },
        { x: 500, y: 260, collected: false },
        { x: 720, y: 180, collected: false },
        { x: 390, y: 120, collected: false }
      ];

      enemies = [
        { x: 300, y: 350, vx: 1.5, minX: 230, maxX: 360, hp: 30, maxHp: 30 },
        { x: 520, y: 270, vx: -1.5, minX: 450, maxX: 580, hp: 40, maxHp: 40 },
        { x: 740, y: 190, vx: 1.8, minX: 680, maxX: 820, hp: 50, maxHp: 50 }
      ];

      hudLevel.textContent = level;
      switchBgm('phonk');
    }

    // Input Handling
    const keys = {};

    window.addEventListener('keydown', (e) => {
      keys[e.code] = true;
      if (e.code === 'KeyQ') switchGenre();
      if (e.code === 'KeyZ' || e.code === 'Space') shootBullet();
    });

    window.addEventListener('keyup', (e) => {
      keys[e.code] = false;
    });

    // Touch Controls Wiring
    function bindTouch(id, onStart, onEnd) {
      const el = document.getElementById(id);
      el.addEventListener('touchstart', (e) => { e.preventDefault(); onStart(); }, { passive: false });
      el.addEventListener('touchend', (e) => { e.preventDefault(); if (onEnd) onEnd(); }, { passive: false });
      el.addEventListener('mousedown', () => onStart());
      el.addEventListener('mouseup', () => { if (onEnd) onEnd(); });
    }

    bindTouch('touch-left', () => { keys['ArrowLeft'] = true; }, () => { keys['ArrowLeft'] = false; });
    bindTouch('touch-right', () => { keys['ArrowRight'] = true; }, () => { keys['ArrowRight'] = false; });
    bindTouch('touch-jump', () => { if (player.isGrounded) { player.vy = player.jumpStrength; playSound('jump'); } });
    bindTouch('touch-shoot', () => shootBullet());
    bindTouch('touch-switch', () => switchGenre());

    function switchGenre() {
      currentGenreIndex = (currentGenreIndex + 1) % GENRES.length;
      hudGenre.textContent = GENRES[currentGenreIndex].name;
      hudGenre.style.color = GENRES[currentGenreIndex].color;
      playSound('switch');
      
      const genreAudios = ['phonk', 'rock', 'reggae'];
      switchBgm(genreAudios[currentGenreIndex]);
    }

    function shootBullet() {
      const now = performance.now();
      const genre = GENRES[currentGenreIndex];
      if (now - player.lastShotTime < genre.fireRate) return;

      player.lastShotTime = now;
      bullets.push({
        x: player.x + player.width,
        y: player.y + player.height / 2,
        vx: genre.bulletSpeed,
        color: genre.color
      });
      playSound('solo_1');
    }

    // Physics & Update
    function update() {
      // Movement
      if (keys['ArrowLeft'] || keys['KeyA']) {
        player.vx = -player.speed;
      } else if (keys['ArrowRight'] || keys['KeyD']) {
        player.vx = player.speed;
      } else {
        player.vx = 0;
      }

      if ((keys['ArrowUp'] || keys['KeyW']) && player.isGrounded) {
        player.vy = player.jumpStrength;
        player.isGrounded = false;
        playSound('jump');
      }

      // Gravity
      player.vy += 0.65;
      player.x += player.vx;
      player.y += player.vy;

      // Platform collisions
      player.isGrounded = false;
      for (const p of platforms) {
        if (
          player.x + player.width > p.x &&
          player.x < p.x + p.w &&
          player.y + player.height >= p.y &&
          player.y + player.height <= p.y + 15 &&
          player.vy >= 0
        ) {
          player.y = p.y - player.height;
          player.vy = 0;
          player.isGrounded = true;
        }
      }

      // Screen Bounds
      if (player.x < 0) player.x = 0;
      if (player.x > canvas.width - player.width) player.x = canvas.width - player.width;

      // Bullets Update
      for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.x += b.vx;

        // Collision with enemies
        for (let j = enemies.length - 1; j >= 0; j--) {
          const en = enemies[j];
          if (b.x >= en.x && b.x <= en.x + 28 && b.y >= en.y && b.y <= en.y + 36) {
            en.hp -= 15;
            bullets.splice(i, 1);
            if (en.hp <= 0) {
              enemies.splice(j, 1);
              player.score += 250;
              hudScore.textContent = player.score;
              playSound('defeat_1');
            }
            break;
          }
        }

        if (b.x > canvas.width) {
          bullets.splice(i, 1);
        }
      }

      // Enemies Update
      for (const en of enemies) {
        en.x += en.vx;
        if (en.x <= en.minX || en.x >= en.maxX) {
          en.vx *= -1;
        }
      }

      // Flask Collection
      for (const f of flasks) {
        if (!f.collected && Math.hypot(player.x - f.x, player.y - f.y) < 32) {
          f.collected = true;
          player.score += 100;
          hudScore.textContent = player.score;
          playSound('flask');
        }
      }
    }

    // Render Loop
    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Background Grid & Stars
      ctx.fillStyle = '#070312';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Platforms
      for (const p of platforms) {
        ctx.fillStyle = '#1e1138';
        ctx.fillRect(p.x, p.y, p.w, p.h);
        ctx.strokeStyle = '#a855f7';
        ctx.lineWidth = 2;
        ctx.strokeRect(p.x, p.y, p.w, p.h);
      }

      // Flasks
      for (const f of flasks) {
        if (!f.collected) {
          ctx.font = '22px sans-serif';
          ctx.fillText('🧪', f.x, f.y);
        }
      }

      // Enemies
      for (const en of enemies) {
        ctx.font = '26px sans-serif';
        ctx.fillText('👾', en.x, en.y + 24);
        
        // HP Bar
        ctx.fillStyle = '#ef4444';
        ctx.fillRect(en.x, en.y - 8, 28, 4);
        ctx.fillStyle = '#22c55e';
        ctx.fillRect(en.x, en.y - 8, (en.hp / en.maxHp) * 28, 4);
      }

      // Bullets
      for (const b of bullets) {
        ctx.fillStyle = b.color;
        ctx.shadowColor = b.color;
        ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.arc(b.x, b.y, 5, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
      }

      // Player Sprite & Wand
      ctx.font = '36px sans-serif';
      ctx.fillText('🧙‍♂️', player.x - 4, player.y + 36);
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    // Initialize and Start
    initLevel();
    loop();
  </script>
</body>
</html>
