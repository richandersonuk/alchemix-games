<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" width="220" height="220">
  <defs>
    <!-- Lab-night shell with electron-teal / electrophile-amber edge -->
    <linearGradient id="mm-shell" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#132a33" />
      <stop offset="55%" stop-color="#0b1620" />
      <stop offset="100%" stop-color="#05090f" />
    </linearGradient>
    <linearGradient id="mm-shell-edge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5eead4" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <linearGradient id="mm-label" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05090f" />
      <stop offset="55%" stop-color="#0e1f2a" />
      <stop offset="100%" stop-color="#2a1a06" />
    </linearGradient>
    <linearGradient id="mm-gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#a16207" />
    </linearGradient>
    <linearGradient id="mm-arrow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#5eead4" />
    </linearGradient>
    <filter id="mm-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Ambient Drop Shadow -->
  <rect x="28" y="14" width="164" height="174" rx="10" fill="#020408" opacity="0.8" />

  <!-- Bottom PCB Connector Housing -->
  <rect x="44" y="176" width="132" height="28" rx="4" fill="#090e1a" stroke="#2dd4bf" stroke-width="2" />
  <rect x="50" y="180" width="120" height="22" rx="2" fill="#062e1e" stroke="#f59e0b" stroke-width="1" />

  <!-- Gold Edge Connector Pins -->
  <g fill="url(#mm-gold)">
    <rect x="55" y="182" width="6" height="19" rx="1" />
    <rect x="65" y="182" width="6" height="19" rx="1" />
    <rect x="75" y="182" width="6" height="19" rx="1" />
    <rect x="85" y="182" width="6" height="19" rx="1" />
    <rect x="95" y="182" width="6" height="19" rx="1" />
    <rect x="105" y="182" width="6" height="19" rx="1" />
    <rect x="115" y="182" width="6" height="19" rx="1" />
    <rect x="125" y="182" width="6" height="19" rx="1" />
    <rect x="135" y="182" width="6" height="19" rx="1" />
    <rect x="145" y="182" width="6" height="19" rx="1" />
    <rect x="155" y="182" width="6" height="19" rx="1" />
    <rect x="163" y="182" width="4" height="19" rx="1" />
  </g>

  <!-- Main Cartridge Body with Left Notch -->
  <path d="M 38 14 H 180 A 8 8 0 0 1 188 22 V 174 A 6 6 0 0 1 182 180 H 38 A 6 6 0 0 1 32 174 V 32 L 44 20 V 14 Z"
        fill="url(#mm-shell)" stroke="url(#mm-shell-edge)" stroke-width="2.5" />

  <!-- Top Grip Spine Ribs -->
  <rect x="52" y="18" width="124" height="18" rx="3" fill="#080c17" stroke="#0f766e" stroke-width="1" />
  <g stroke="#2dd4bf" stroke-width="1.8" stroke-linecap="round">
    <line x1="60" y1="22" x2="168" y2="22" />
    <line x1="60" y1="27" x2="168" y2="27" />
    <line x1="60" y1="32" x2="168" y2="32" />
  </g>

  <!-- Side Grip Grooves -->
  <g fill="#060911" stroke="#0f766e" stroke-width="0.8">
    <rect x="33" y="52" width="7" height="5" rx="1" />
    <rect x="33" y="62" width="7" height="5" rx="1" />
    <rect x="33" y="72" width="7" height="5" rx="1" />
    <rect x="33" y="82" width="7" height="5" rx="1" />
    <rect x="180" y="52" width="7" height="5" rx="1" />
    <rect x="180" y="62" width="7" height="5" rx="1" />
    <rect x="180" y="72" width="7" height="5" rx="1" />
    <rect x="180" y="82" width="7" height="5" rx="1" />
  </g>

  <!-- Security Screws -->
  <g fill="#475569" stroke="#cbd5e1" stroke-width="1">
    <circle cx="43" cy="166" r="4.5" />
    <line x1="40.5" y1="166" x2="45.5" y2="166" stroke="#0f172a" stroke-width="1.4" />
    <circle cx="177" cy="166" r="4.5" />
    <line x1="174.5" y1="166" x2="179.5" y2="166" stroke="#0f172a" stroke-width="1.4" />
  </g>

  <!-- Recessed Center Label Well + Sticker -->
  <rect x="46" y="42" width="128" height="114" rx="6" fill="#04060c" stroke="#2dd4bf" stroke-width="1.5" />
  <rect x="49" y="45" width="122" height="108" rx="4" fill="url(#mm-label)" stroke="#f59e0b" stroke-width="1.2" />

  <!-- Top Sticker Header Band -->
  <path d="M 50 49 A 3 3 0 0 1 53 46 H 167 A 3 3 0 0 1 170 49 V 61 H 50 Z" fill="#2dd4bf" />
  <text x="110" y="56.5" text-anchor="middle" fill="#04131a" font-family="monospace" font-weight="900" font-size="7.6" letter-spacing="1">MECHANISM MAESTRO</text>

  <!-- Label art: electrophilic addition, C=C attacking H–Br -->
  <g font-family="monospace" font-weight="900">
    <!-- H–Br with dipole -->
    <text x="138" y="78" text-anchor="middle" fill="#e0a96d" font-size="11">Br</text>
    <line x1="138" y1="81" x2="138" y2="94" stroke="#cbd5e1" stroke-width="1.6" />
    <text x="138" y="104" text-anchor="middle" fill="#e2e8f0" font-size="10">H</text>
    <text x="126" y="104" text-anchor="middle" fill="#fbbf24" font-size="6.5">δ+</text>
    <text x="126" y="74" text-anchor="middle" fill="#5eead4" font-size="6.5">δ−</text>
    <g fill="#2dd4bf">
      <circle cx="146.5" cy="72" r="1.2" /><circle cx="146.5" cy="76" r="1.2" />
      <circle cx="136" cy="66.5" r="1.2" /><circle cx="140" cy="66.5" r="1.2" />
    </g>

    <!-- C=C -->
    <text x="74" y="133" text-anchor="middle" fill="#e2e8f0" font-size="10">H₂C</text>
    <line x1="85" y1="128" x2="104" y2="128" stroke="#cbd5e1" stroke-width="1.5" />
    <line x1="85" y1="132" x2="104" y2="132" stroke="#cbd5e1" stroke-width="1.5" />
    <text x="115" y="133" text-anchor="middle" fill="#e2e8f0" font-size="10">CH₂</text>
  </g>

  <!-- Curly arrows: π bond → H, H–Br bond → Br -->
  <g filter="url(#mm-glow)" fill="none" stroke="url(#mm-arrow)" stroke-width="2.4" stroke-linecap="round">
    <path d="M 94 125 C 94 104, 112 96, 129 99" />
    <path d="M 141 89 C 152 88, 154 80, 148 76" />
  </g>
  <g fill="#5eead4">
    <polygon points="132.5,99.4 125.6,95.2 126.6,103" />
    <polygon points="145.6,73.2 145,81 151.8,77.5" />
  </g>

  <!-- Badges -->
  <g transform="translate(54, 67)">
    <rect x="0" y="0" width="30" height="14" rx="3" fill="#2a1a06" stroke="#f59e0b" stroke-width="1" />
    <text x="15" y="9.6" text-anchor="middle" fill="#fde047" font-family="monospace" font-weight="900" font-size="7">C⁺</text>
  </g>
  <g transform="translate(54, 86)">
    <rect x="0" y="0" width="30" height="14" rx="3" fill="#062230" stroke="#2dd4bf" stroke-width="1" />
    <text x="15" y="9.6" text-anchor="middle" fill="#99f6e4" font-family="monospace" font-weight="900" font-size="6.6">:Nu⁻</text>
  </g>

  <!-- Bottom ROM Serial Badge on Sticker -->
  <rect x="55" y="144" width="110" height="7" rx="2" fill="#070a12" stroke="#2dd4bf" stroke-width="0.8" />
  <text x="110" y="149.6" text-anchor="middle" fill="#fde047" font-family="monospace" font-weight="bold" font-size="5.6" letter-spacing="0.8">ALX-09 • CURLY ARROWS</text>

  <!-- Molded Downward Insertion Triangle -->
  <polygon points="103,163 117,163 110,172" fill="#0f766e" stroke="#2dd4bf" stroke-width="1" />
</svg>
