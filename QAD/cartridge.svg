<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" width="220" height="220">
  <defs>
    <!-- Crimson Noir & Brass Forensic Cartridge Shell -->
    <linearGradient id="qad-shell" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3f1324" />
      <stop offset="55%" stop-color="#230b16" />
      <stop offset="100%" stop-color="#11050b" />
    </linearGradient>
    <linearGradient id="qad-shell-edge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#881337" />
    </linearGradient>
    <!-- Sticker Label Gradient (Forensic Dark Lab) -->
    <linearGradient id="qad-label" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="55%" stop-color="#1c1124" />
      <stop offset="100%" stop-color="#2e1018" />
    </linearGradient>
    <!-- Gold PCB Pins Gradient -->
    <linearGradient id="qad-gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#a16207" />
    </linearGradient>
    <!-- Lilac / Crimson Flame Gradient -->
    <linearGradient id="qad-flame" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#e879f9" />
      <stop offset="100%" stop-color="#fb7185" />
    </linearGradient>
    <filter id="qad-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Ambient Drop Shadow -->
  <rect x="28" y="14" width="164" height="174" rx="10" fill="#050207" opacity="0.78" />

  <!-- Bottom PCB Connector Housing -->
  <rect x="44" y="176" width="132" height="28" rx="4" fill="#180810" stroke="#fb7185" stroke-width="2" />
  <rect x="50" y="180" width="120" height="22" rx="2" fill="#062e1e" stroke="#f59e0b" stroke-width="1" />

  <!-- Gold Edge Connector Pins -->
  <g fill="url(#qad-gold)">
    <rect x="55" y="182" width="6" height="19" rx="1" />
    <rect x="65" y="182" width="6" height="19" rx="1" />
    <rect x="75" y="182" width="6" height="19" rx="1" />
    <rect x="85" y="182" width="6" height="19" rx="1" />
    <rect x="95" y="182" width="6" height="19" rx="1" />
    <rect x="105" y="182" width="6" height="19" rx="1" />
    <rect x="115" y="182" width="6" height="19" rx="1" />
    <rect x="125" y="182" width="6" height="19" rx="1" />
    <rect x="135" y="182" width="6" height="19" rx="1" />
    <rect x="145" y="182" width="6" height="19" rx="1" />
    <rect x="155" y="182" width="6" height="19" rx="1" />
    <rect x="163" y="182" width="4" height="19" rx="1" />
  </g>

  <!-- Main Cartridge Body with Left Notch -->
  <path d="M 38 14
           H 180
           A 8 8 0 0 1 188 22
           V 174
           A 6 6 0 0 1 182 180
           H 38
           A 6 6 0 0 1 32 174
           V 32
           L 44 20
           V 14 Z"
        fill="url(#qad-shell)"
        stroke="url(#qad-shell-edge)"
        stroke-width="2.5" />

  <!-- Top Grip Spine Ribs -->
  <rect x="52" y="18" width="124" height="18" rx="3" fill="#18060e" stroke="#9f1239" stroke-width="1" />
  <g stroke="#fb7185" stroke-width="1.8" stroke-linecap="round">
    <line x1="60" y1="22" x2="168" y2="22" />
    <line x1="60" y1="27" x2="168" y2="27" />
    <line x1="60" y1="32" x2="168" y2="32" />
  </g>

  <!-- Side Grip Grooves -->
  <g fill="#12040a" stroke="#9f1239" stroke-width="0.8">
    <rect x="33" y="52" width="7" height="5" rx="1" />
    <rect x="33" y="62" width="7" height="5" rx="1" />
    <rect x="33" y="72" width="7" height="5" rx="1" />
    <rect x="33" y="82" width="7" height="5" rx="1" />
    <rect x="180" y="52" width="7" height="5" rx="1" />
    <rect x="180" y="62" width="7" height="5" rx="1" />
    <rect x="180" y="72" width="7" height="5" rx="1" />
    <rect x="180" y="82" width="7" height="5" rx="1" />
  </g>

  <!-- Brass Security Screws -->
  <g fill="#b45309" stroke="#fcd34d" stroke-width="1">
    <circle cx="43" cy="166" r="4.5" />
    <line x1="40.5" y1="166" x2="45.5" y2="166" stroke="#451a03" stroke-width="1.4" />
    <circle cx="177" cy="166" r="4.5" />
    <line x1="174.5" y1="166" x2="179.5" y2="166" stroke="#451a03" stroke-width="1.4" />
  </g>

  <!-- Recessed Center Label Well -->
  <rect x="46" y="42" width="128" height="114" rx="6" fill="#07040a" stroke="#be123c" stroke-width="1.5" />

  <!-- Glossy Cartridge Label Sticker -->
  <rect x="49" y="45" width="122" height="108" rx="4" fill="url(#qad-label)" stroke="#fbbf24" stroke-width="1.3" />

  <!-- Top Sticker Header Band -->
  <path d="M 50 49 A 3 3 0 0 1 53 46 H 167 A 3 3 0 0 1 170 49 V 61 H 50 Z" fill="#e11d48" />
  <text x="110" y="56.5" text-anchor="middle" fill="#ffffff" font-family="monospace" font-weight="900" font-size="8.5" letter-spacing="1.1">QUALITATIVE DET.</text>

  <!-- 5 Mystery Test Tubes in Brass Rack (Left/Center of Label) -->
  <g transform="translate(56, 70)">
    <!-- Rack Top & Bottom Bars -->
    <rect x="0" y="14" width="78" height="4" rx="1.5" fill="#d97706" stroke="#fef08a" stroke-width="0.6" />
    <rect x="0" y="48" width="78" height="5" rx="1.5" fill="#92400e" stroke="#fbbf24" stroke-width="0.8" />
    <rect x="3" y="14" width="3" height="36" fill="#b45309" />
    <rect x="72" y="14" width="3" height="36" fill="#b45309" />

    <!-- Tube 1: Cu2+ Sky Blue Precipitate -->
    <g transform="translate(9, 2)">
      <path d="M 0 0 V 38 A 4.5 4.5 0 0 0 9 38 V 0" fill="#0f172a" stroke="#cbd5e1" stroke-width="1.2" />
      <path d="M 1 16 V 38 A 3.5 3.5 0 0 0 8 38 V 16 Z" fill="#38bdf8" />
      <circle cx="4.5" cy="34" r="2.2" fill="#bae6fd" />
      <text x="4.5" y="-2" text-anchor="middle" fill="#fde047" font-family="monospace" font-weight="bold" font-size="7">?</text>
    </g>

    <!-- Tube 2: Fe2+ Dirty Green Precipitate -->
    <g transform="translate(22, 2)">
      <path d="M 0 0 V 38 A 4.5 4.5 0 0 0 9 38 V 0" fill="#0f172a" stroke="#cbd5e1" stroke-width="1.2" />
      <path d="M 1 18 V 38 A 3.5 3.5 0 0 0 8 38 V 18 Z" fill="#22c55e" />
      <circle cx="4.5" cy="35" r="2.2" fill="#86efac" />
      <text x="4.5" y="-2" text-anchor="middle" fill="#fde047" font-family="monospace" font-weight="bold" font-size="7">?</text>
    </g>

    <!-- Tube 3: Fe3+ Foxy Red-Brown Precipitate -->
    <g transform="translate(35, 2)">
      <path d="M 0 0 V 38 A 4.5 4.5 0 0 0 9 38 V 0" fill="#0f172a" stroke="#cbd5e1" stroke-width="1.2" />
      <path d="M 1 15 V 38 A 3.5 3.5 0 0 0 8 38 V 15 Z" fill="#ea580c" />
      <circle cx="4.5" cy="34" r="2.2" fill="#fdba74" />
      <text x="4.5" y="-2" text-anchor="middle" fill="#fde047" font-family="monospace" font-weight="bold" font-size="7">?</text>
    </g>

    <!-- Tube 4: AgI Pale Yellow Precipitate -->
    <g transform="translate(48, 2)">
      <path d="M 0 0 V 38 A 4.5 4.5 0 0 0 9 38 V 0" fill="#0f172a" stroke="#cbd5e1" stroke-width="1.2" />
      <path d="M 1 19 V 38 A 3.5 3.5 0 0 0 8 38 V 19 Z" fill="#facc15" />
      <circle cx="4.5" cy="35" r="2.2" fill="#fef9c3" />
      <text x="4.5" y="-2" text-anchor="middle" fill="#fde047" font-family="monospace" font-weight="bold" font-size="7">?</text>
    </g>

    <!-- Tube 5: K+ Lilac / Unknown Violet -->
    <g transform="translate(61, 2)">
      <path d="M 0 0 V 38 A 4.5 4.5 0 0 0 9 38 V 0" fill="#0f172a" stroke="#cbd5e1" stroke-width="1.2" />
      <path d="M 1 17 V 38 A 3.5 3.5 0 0 0 8 38 V 17 Z" fill="#c084fc" />
      <circle cx="4.5" cy="34" r="2.2" fill="#f3e8ff" />
      <text x="4.5" y="-2" text-anchor="middle" fill="#fde047" font-family="monospace" font-weight="bold" font-size="7">?</text>
    </g>
  </g>

  <!-- Bunsen Burner & Nichrome Flame Test (Right Side of Label) -->
  <g transform="translate(148, 86)">
    <!-- Burner Base & Barrel -->
    <path d="M -10 36 L -5 30 H 5 L 10 36 Z" fill="#64748b" stroke="#cbd5e1" stroke-width="1" />
    <rect x="-3" y="14" width="6" height="16" fill="#94a3b8" stroke="#e2e8f0" stroke-width="0.8" />
    <!-- Roaring Flame Test Plume -->
    <path d="M 0 14 C -10 6 -9 -8 0 -18 C 9 -8 10 6 0 14 Z" fill="url(#qad-flame)" filter="url(#qad-glow)" />
    <path d="M 0 14 C -4 8 -4 0 0 -7 C 4 0 4 8 0 14 Z" fill="#bae6fd" />
  </g>

  <!-- Detective Magnifying Loupe Overlapping Rack -->
  <g transform="translate(115, 96)">
    <line x1="9" y1="9" x2="21" y2="21" stroke="#f59e0b" stroke-width="4.5" stroke-linecap="round" />
    <circle cx="0" cy="0" r="13" fill="rgba(56, 189, 248, 0.18)" stroke="#fbbf24" stroke-width="2.5" />
    <path d="M -7 -5 A 8 8 0 0 1 3 -8" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" />
    <text x="0" y="3" text-anchor="middle" fill="#fef08a" font-family="monospace" font-weight="900" font-size="8">Ag⁺</text>
  </g>

  <!-- Bottom ROM Serial Badge on Sticker -->
  <rect x="55" y="136" width="110" height="12" rx="2" fill="#09040c" stroke="#fb7185" stroke-width="1" />
  <text x="110" y="144.5" text-anchor="middle" fill="#fbbf24" font-family="monospace" font-weight="bold" font-size="7" letter-spacing="0.8">ALX-04 • FORENSIC LAB</text>

  <!-- Molded Downward Insertion Triangle on Cartridge Shell -->
  <polygon points="103,163 117,163 110,172" fill="#be123c" stroke="#fb7185" stroke-width="1" />
</svg>
